  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-size: 1.25rem; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .brand small { display: block; color: var(--muted); font-size: 0.76rem; }
  .iconbtn { border: 0; background: transparent; border-radius: 12px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn.on { color: var(--text); background: color-mix(in srgb, var(--text) 9%, transparent); }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 4px; font-weight: 750; }
  .muted { color: var(--muted); }
  .small { font-size: 0.86rem; }
  .tiny { font-size: 0.76rem; }
  .save-t { color: var(--save); }
  .warn-t { color: var(--warn); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .lbl { font-size: 0.8rem; font-weight: 650; color: var(--muted); margin: 10px 0 6px; }
  .lbl:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: var(--card); font-size: 0.88rem; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-weight: 650; min-height: 36px; white-space: nowrap; }
  .chip.on { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .seg { display: inline-flex; background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 0.86rem; font-weight: 650; padding: 7px 12px; border-radius: 9px; cursor: pointer; min-height: 34px; }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .switch { position: relative; width: 48px; height: 29px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: color-mix(in srgb, var(--text) 18%, transparent); border-radius: 999px; cursor: pointer; transition: .15s; }
  .switch span::after { content: ""; position: absolute; width: 23px; height: 23px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + span { background: var(--btn); }
  .switch input:checked + span::after { transform: translateX(19px); background: var(--btn-ink); }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
  .setrow:first-of-type { border-top: 0; }
  details > summary { cursor: pointer; list-style: none; font-weight: 650; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: ""; display: inline-block; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 0 3px 8px; }
  details[open] > summary::after { transform: rotate(-135deg); margin-bottom: -1px; }
  .filters > summary { padding: 2px 0; }
  .summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 10px; }
  .summary select { flex: none; }
  .summary b { font-size: 1.02rem; }
  select { font: inherit; font-size: 0.88rem; font-weight: 650; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; min-height: 36px; }
  /* offer card */

  .offer .name { font-weight: 800; font-size: 1.05rem; line-height: 1.25; }
  .offer .trim { color: var(--muted); font-size: 0.84rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .offer .price { text-align: right; font-weight: 800; font-size: 1.22rem; white-space: nowrap; }
  .offer .off { text-align: right; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
  .facts { margin-top: 8px; display: grid; gap: 3px; font-size: 0.86rem; }
  .facts .k { color: var(--muted); }
  .stars { letter-spacing: 1px; font-size: 0.82rem; }
  .flag { display: inline-block; font-size: 0.74rem; font-weight: 750; padding: 1px 6px; border-radius: 6px; white-space: nowrap; vertical-align: 1px; }

  .flag.w { color: var(--warn); background: var(--warn-soft); }
  .flag.n { color: var(--muted); background: var(--soft); }
  .note-w { margin-top: 6px; font-size: 0.82rem; font-weight: 650; color: var(--warn); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-size: 0.86rem; font-weight: 650; cursor: pointer; min-height: 38px; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--text) 30%, transparent); }
  .more { margin-top: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 0.84rem; display: grid; gap: 4px; }
  .more .row { align-items: flex-start; }
  .more b { font-weight: 700; }
  .hist { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; display: grid; gap: 4px; }
  .hist .htitle { font-weight: 700; color: var(--text); }
  svg.pc { width: 100%; height: auto; display: block; touch-action: pan-y; overflow: visible; }
  svg.pc text { font-size: 11px; fill: var(--muted); font-family: inherit; }
  .ctip { font-size: 0.8rem; color: var(--text); min-height: 1.2em; }
  .drop.big { font-weight: 700; }
  .checked { margin-top: 8px; font-size: 0.74rem; color: var(--muted); }
  .others { margin: -4px 0 12px; padding: 0 6px; }
  .empty { color: var(--muted); padding: 10px 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  td, th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem; border-top: 0; }
  td.num { text-align: right; white-space: nowrap; }
  .page { display: none; }
  .page.on { display: block; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }
  ul.plain { margin: 4px 0 0; padding-left: 18px; }
  ul.plain li { margin: 3px 0; font-size: 0.88rem; }

function chip(label, on, attrs) { return `<button class="chip ${on ? "on" : ""}" ${attrs}>${esc(label)}</button>`; }
function renderFilters() {
  const budgets = [15000, 18000, 20000, 22000, 25000, 30000, 35000, 40000, 50000];
  const bodies = ["estate", "suv", "hatch", "mpv", "sedan", "coupe"];
  const brands = [...new Set((DATA?.offers || []).map((o) => o.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const nf = state.brands.length + state.fuels.length + state.gears.length + state.conds.length + (state.minBoot ? 1 : 0) + (state.minRel ? 1 : 0) + (state.onlyTwice ? 1 : 0) + (state.hideFin ? 1 : 0) + (state.onlyOfficial ? 1 : 0) + (state.onlyDrop ? 1 : 0) + (state.onlyAuth ? 0 : 1);
  const wasOpen = $("moreF")?.open;
  $("filtersCard").innerHTML = `
    <div class="lbl">${t("budget")}</div>
    <div class="chips scroll">${budgets.map((b) => chip(t("upTo", { v: (b / 1000) + " 000 €" }), state.max === b, `data-max="${b}"`)).join("")}${chip(t("any"), !state.max, `data-max="0"`)}</div>
    <div class="lbl">${t("body")}</div>
    <div class="chips">${bodies.map((b) => chip(t("b_" + b), state.bodies.includes(b), `data-body="${b}"`)).join("")}</div>
    <details class="filters" id="moreF" ${wasOpen ? "open" : ""} style="margin-top:12px"><summary class="small">${t("filters")}${nf ? ` (${nf})` : ""}</summary>
      <div class="lbl">${t("brands")}</div><div class="chips">${brands.map((b) => chip(b, state.brands.includes(b), `data-brand="${esc(b)}"`)).join("")}</div>
      <div class="lbl">${t("fuel")}</div><div class="chips">${["petrol", "hybrid", "phev", "ev", "diesel", "lpg"].map((f) => chip(t("f_" + f), state.fuels.includes(f), `data-fuel="${f}"`)).join("")}</div>
      <div class="lbl">${t("gear")}</div><div class="chips">${["man", "auto"].map((g) => chip(t("g_" + g), state.gears.includes(g), `data-gear="${g}"`)).join("")}</div>
      <div class="lbl">${t("cond")}</div><div class="chips">${["new", "demo"].map((c) => chip(t("c_" + c), state.conds.includes(c), `data-cond="${c}"`)).join("")}</div>
      <div class="lbl">${t("minBoot")}</div><div class="chips">${[0, 350, 400, 450, 500, 600].map((l) => chip(l ? l + " l" : t("any"), state.minBoot === l, `data-boot="${l}"`)).join("")}</div>
      <div class="lbl">${t("minRel")}</div><div class="chips">${[0, 3, 3.5, 4, 4.5].map((r) => chip(r ? r + "/5" : t("any"), state.minRel === r, `data-rel="${r}"`)).join("")}</div>
      <div style="margin-top:8px">
        ${[["onlyAuth"], ["onlyTwice"], ["hideFin"], ["onlyDrop"], ["onlyOfficial"], ["onePer", "onePerModel"]].map(([k, lab]) => `<label class="setrow"><span>${t(lab || k)}</span><span class="switch"><input type="checkbox" data-sw="${k}" ${state[k] ? "checked" : ""}><span></span></span></label>`).join("")}
      </div>
      <button class="btn ghost" data-reset="1" style="margin-top:6px">${t("resetF")}</button>
    </details>`;
}

function offerHtml(o, extra) {
  const d = discount(o), r = relOf(o), sp = spaceOf(o), fl = o.flags || [], open = OPEN === o.id;
  const meta = [t("c_" + o.cond) + (o.cond === "demo" && o.km ? " · " + t("km", { v: Math.round(o.km).toLocaleString(loc()) }) : ""), o.year, t("f_" + o.fuel) + (o.mhev && o.fuel === "petrol" ? " mild-hybrid" : ""), t("g_" + o.gear), o.kw ? Math.round(o.kw) + " kW" : ""].filter(Boolean).join(" · ");
  const stars = r ? "★★★★★".slice(0, Math.floor(r.s)) + (r.s % 1 ? "½" : "") + "☆☆☆☆☆".slice(0, 5 - Math.ceil(r.s)) : "";
  const ver = o.twin ? (o.twin.agree ? `<span class="save-t" style="font-weight:700">✓✓ ${t("verified2")}</span>` : `<span class="warn-t" style="font-weight:700">${t("verified2diff", { v: eur(o.twin.price) })}</span>`) : (o.off ? `✓ ${t("official", { b: esc(o.brand) })}` : (o.auth ? `✓ ${t("portal")}` : `<span class="warn-t">${t("notAuth")}</span>`));
  const flags = fl.filter((f) => f !== "fin_cheaper").map((f) => `<div class="note-w">! ${t("fl_" + f)}${f === "fin" && o.cash ? " · " + t("cashKnown", { v: eur(o.cash) }) : ""}</div>`).join("");
  const fin = [];
  if (o.fin_price) fin.push(`${t("fl_fin_cheaper")}: <b>${eur(o.fin_price)}</b>`);
  if (o.fin && o.fin.monthly) fin.push(t("monthly", { v: eur(o.fin.monthly) }));
  else if (o.monthly) fin.push(t("monthly", { v: eur(o.monthly) }));
  if (o.zero_rate) fin.push(`<span class="flag s">${t("zero")}</span>`);
  let more = "";
  if (open) {
    const f = o.fin || {};
    const rows = [];
    if ((o.flags || []).includes("fin") && o.cash) {
      rows.push(`<div class="row"><span>${t("finOnly")}</span><b>${eur(o.price)}</b></div>`);
      rows.push(`<div class="row"><span>${t("cash")}</span><span>${eur(o.cash)}</span></div>`);
    } else rows.push(`<div class="row"><span>${t(fl.some((f) => ["fin", "tradein", "company", "insurance"].includes(f)) ? "priceCond" : "cash")}</span><b>${eur(o.price)}</b></div>`);
    if (o.finPrice) rows.push(`<div class="row"><span>${t("finOnly")}</span><span>${eur(o.finPrice)}</span></div>`);
    if (o.list) rows.push(`<div class="row"><span>${t("listP")}</span><span>${eur(o.list)}</span></div>`);
    if (o.low30) rows.push(`<div class="row"><span>${t("lowest30", { v: "" }).replace(/:\s*$/, "")}</span><span>${eur(o.low30)}</span></div>`);
    if (f.total && f.total > o.price * 0.85) {
      const ins = f.months && (f.ins_month || f.pfs_month) ? f.months * ((f.ins_month || 0) + (f.pfs_month || 0)) : 0;
      rows.push(`<div>${t(f.rpmn ? "finTotal" : "finTotalNoR", { t: eur(f.total), r: String(f.rpmn).replace(".", state.lang === "sk" ? "," : "."), d: eur(Math.max(0, f.total - ins - o.price)) })}${ins ? " " + t("finIns", { v: eur(ins) }) : ""}</div>`);
    }
    if (f.down_pct != null && f.months) rows.push(`<div class="muted">${t("finTerms", { a: f.down_pct, m: f.months, s: eur(f.monthly), l: f.last ? t("finLast", { v: eur(f.last) }) : "" })}</div>`);
    if (r) rows.push(`<div class="muted">${t("relWhy", { s: dec(r.s), w: dec(r.w), tuv: r.tuv ? t("relTuv", { v: dec(r.tuv) }) : "", note: r.note ? " · " + esc(r.note) : "" })}</div>`);
    else rows.push(`<div class="muted">${t("relNoData")}</div>`);
    rows.push(`<div class="muted">${sp ? `${t("boot")} ${sp.l} l${sp.max ? " (" + sp.max + " l " + t("folded") + ")" : ""}${sp.s && sp.s !== 5 ? " · " + t("seats", { n: sp.s }) : ""} — ${esc(sp.row)} · <a href="${esc(sp.src)}" target="_blank" rel="noopener">${t("bootSrc", { s: sp.by })}</a>` : t("bootNone")}</div>`);
    if (o.perks && o.perks.length) rows.push(`<div class="muted">${o.perks.map(esc).join(" · ")}</div>`);
    if (o.vin) rows.push(`<div class="muted">${t("vin")}: ${esc(o.vin)}</div>`);
    rows.push(historyHtml(o));
    more = `<div class="more">${rows.join("")}</div>`;
  }
  return `<article class="offer">
    <div class="head" data-open="${esc(o.id)}">
      <div><div class="name">${esc(o.brand)} ${esc(o.model || "")}</div><div class="trim">${esc(o.title.replace(new RegExp("^" + o.brand.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*", "i"), ""))}</div></div>
      <div><div class="price">${eur(o.price)}</div>${d ? `<div class="off save-t">${t("disc", { v: eur(d), p: Math.round(d / o.list * 100) })}</div>` : ""}${o.drop ? `<div class="off save-t drop ${dropPct(o) >= 0.05 ? "big" : ""}">${t("dropBadge", { v: eur(o.drop), d: dTxt(o.drop_from) })}</div>` : ""}</div>
    </div>
    <div class="facts">
      <div>${esc(meta)}</div>
      <div>${sp ? `${t("boot")} <b>${sp.l} l</b>${sp.s && sp.s !== 5 ? " · " + t("seats", { n: sp.s }) : ""}` : `<span class="muted">${t("boot")} —</span>`} · ${t("rel")} ${r ? `<span class="stars" aria-label="${r.s}/5">${stars}</span> ${dec(r.s)}/5` : `<span class="muted">${t("relNone")}</span>`}</div>
      <div>${esc(o.dealer || "")}${o.city ? (o.dealer ? ", " : "") + esc(o.city) : ""}${o.n > 1 ? ` <span class="muted">· ${t("sameN", { n: o.n })}</span>` : ""}</div>
      <div class="small">${ver}${o.audit === "ok" ? ` · <span class="save-t">${t("auditOk")}</span>` : o.audit === "fail" || o.audit === "gone" ? ` · <span class="warn-t">${t("auditFail")}</span>` : ""}</div>
      ${fin.length ? `<div class="small">${fin.join(" · ")}</div>` : ""}
    </div>
    ${flags}${o.stale ? `<div class="note-w">${t("stale")}</div>` : ""}
    ${more}
    <div class="acts"><a class="btn primary" href="${esc(o.url)}" target="_blank" rel="noopener">${t("open")} ↗</a>${o.twin ? `<a class="btn" href="${esc(o.twin.url)}" target="_blank" rel="noopener">${t("open2")} ↗</a>` : ""}<button class="btn ghost" data-open="${esc(o.id)}">${open ? t("less") : t("details")}</button></div>
    <div class="checked">${t("checkedAt", { d: dtTxt(o.read || o.checked || DATA.generated) })}${o.first ? " · " + t("seenSince", { d: dTxt(o.first) }) : ""}${o.upd ? " · " + t("dealerUpd", { d: dTxt(o.upd) }) : ""}</div>
  </article>${extra || ""}`;
}

function renderList() {
  if (!DATA) return;
  const list = sorted(filtered());
  let shown = list;
  const groups = {};
  if (state.onePer) {
    for (const o of list) { const k = o.brand + "|" + nrm(o.model); (groups[k] = groups[k] || []).push(o); }
    shown = list.filter((o) => groups[o.brand + "|" + nrm(o.model)][0] === o);
  }
  $("summary").innerHTML = list.length ? `<div style="min-width:0"><b>${t("nOffers", { n: list.length.toLocaleString(loc()) })}</b> <span class="small muted" style="white-space:nowrap">${t("from", { v: eur(Math.min(...list.map((o) => o.price))) })}</span></div>
    <select id="sortSel" aria-label="${t("sort")}">${["price", "drop", "disc", "space", "rel", "monthly", "new"].map((s) => `<option value="${s}" ${state.sort === s ? "selected" : ""}>${t("s_" + s)}</option>`).join("")}</select>` : "";
  if (!list.length) { $("list").innerHTML = `<div class="empty">${t("none")}</div>`; return; }
  $("list").innerHTML = shown.slice(0, 150).map((o) => {
    const k = o.brand + "|" + nrm(o.model), g = state.onePer ? groups[k] : null;
    if (!g || g.length < 2) return offerHtml(o);
    const exp = EXPAND.has(k);
    const extra = exp ? g.slice(1).map((x) => offerHtml(x)).join("") + `<div class="others"><button class="btn ghost" data-exp="${esc(k)}">${t("lessOf")}</button></div>`
      : `<div class="others"><button class="btn ghost" data-exp="${esc(k)}">${t("moreOf", { n: g.length - 1, m: esc(o.brand + " " + (o.model || "")) })} · ${eur(g[1].price).replace(" €", "")} – ${eur(Math.max(...g.map((x) => x.price)))}</button></div>`;
    return offerHtml(o, extra);
  }).join("");
}

function renderPromos() {
  const ps = (PROMOS || []).filter((p) => !state.brands.length || state.brands.includes(p.brand));
  $("promoCard").hidden = !ps.length;
  if (!ps.length) return;
  $("promoSum").innerHTML = `${t("promos")} <span class="small muted">(${ps.length})</span>`;
  $("promoOut").innerHTML = `<p class="small muted" style="margin:8px 0">${t("promosNote")}</p>` + ps.map((p) => `<div style="padding:10px 0;border-top:1px solid var(--line)">
    <div class="row"><b>${esc(p.brand)}</b><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">${t("open")} ↗</a></div>
    <div class="tiny muted">${esc(p.title)}</div>
    <ul class="plain">${p.snips.map((x) => `<li>„${esc(x)}“</li>`).join("")}</ul></div>`).join("");
}
function renderSettings() {
  const src = DATA?.sources || {};
  const NAMES = { kia: "Kia — kiaihned.sk (oficiálny)", hyundai: "Hyundai — skladove.hyundai.sk (oficiálny)", st_peugeot: "Peugeot — peugeot.skladovevozidla.sk", st_citroen: "Citroën — skladovevozidla.citroen.sk", st_fiat: "Fiat — fiat.skladovevozidla.sk", st_jeep: "Jeep — jeep.skladovevozidla.sk", st_alfaromeo: "Alfa Romeo — alfaromeo.skladovevozidla.sk", st_ds: "DS — skladovevozidla.dsautomobiles.sk", mitsubishi: "Mitsubishi — mitsubishi-motors.sk", dacia: "Dacia — skladove-vozidla.dacia.sk", renault: "Renault — ihned.renault.sk", opel: "Opel — online.opel-ihned.sk", mazda: "Mazda — mazdaihned.sk", autobazar: "autobazar.eu — nové a predvádzacie autá" };
  $("setOut").innerHTML = `<div class="card"><h2>${t("set")}</h2>
    <div class="setrow"><span>${t("lang")}</span><div class="seg" id="lang">${["sk", "en"].map((l) => `<button data-lang="${l}" class="${state.lang === l ? "on" : ""}">${l === "sk" ? "Slovenčina" : "English"}</button>`).join("")}</div></div></div>
    <div class="card"><h2>${t("sources")}</h2><table><tbody>${Object.entries(src).map(([k, v]) => `<tr><td>${esc(NAMES[k] || k)}</td><td class="num ${v.status === "ok" ? "muted" : "warn-t"}">${v.status === "ok" ? t("src_ok", { n: v.offers }) : v.status === "blocked" ? t("src_blocked") : t("src_error")}</td></tr>`).join("")}</tbody></table>
    <p class="small muted">${t("notCovered")}</p>${DATA?.audit ? `<p class="small">${t("auditSum", { c: DATA.audit.checked, k: DATA.audit.ok, g: DATA.audit.gone || 0 })}</p>` : ""}</div>
    <div class="card"><h2>${t("how")}</h2><ul class="plain">${["how1", "how2", "how3", "how7", "how8", "how4", "how5", "how6"].map((k) => `<li>${t(k)}</li>`).join("")}</ul><p class="small muted">${t("relSrc")}</p></div>`;
}

function renderChrome() {
  $("title").textContent = state.tab === "set" ? t("tSet") : t("tList");
  $("gear").classList.toggle("on", state.tab === "set");
  $("p-list").classList.toggle("on", state.tab !== "set");
  $("p-set").classList.toggle("on", state.tab === "set");
  if (DATA) $("updated").textContent = t("checked", { d: dtTxt(DATA.generated) });
  document.documentElement.lang = state.lang;
}
function renderAll() { renderChrome(); renderFilters(); renderPromos(); renderList(); renderSettings(); }

// ------------------------------------------------------------------ events
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-open]");
  if (!b || e.target.closest("a")) return;
  const tog = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
  if (b.id === "gear") { state.tab = state.tab === "set" ? "list" : "set"; save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.lang) { state.lang = b.dataset.lang; save(); renderAll(); return; }
  if (b.dataset.open) { OPEN = OPEN === b.dataset.open ? null : b.dataset.open; if (OPEN) loadModels(); renderList(); return; }
  if (b.dataset.exp) { const k = b.dataset.exp; EXPAND.has(k) ? EXPAND.delete(k) : EXPAND.add(k); renderList(); return; }
  if (b.dataset.max != null) state.max = +b.dataset.max;
  else if (b.dataset.body) state.bodies = tog(state.bodies, b.dataset.body);
  else if (b.dataset.brand) state.brands = tog(state.brands, b.dataset.brand);
  else if (b.dataset.fuel) state.fuels = tog(state.fuels, b.dataset.fuel);
  else if (b.dataset.gear) state.gears = tog(state.gears, b.dataset.gear);
  else if (b.dataset.cond) state.conds = tog(state.conds, b.dataset.cond);
  else if (b.dataset.boot != null) state.minBoot = +b.dataset.boot;
  else if (b.dataset.rel != null) state.minRel = +b.dataset.rel;
  else if (b.dataset.reset) { Object.assign(state, { brands: [], fuels: [], gears: [], conds: [], minBoot: 0, minRel: 0, onlyAuth: true, onlyTwice: false, hideFin: false, onlyOfficial: false, onlyDrop: false }); }
  else return;
  save(); renderFilters(); renderPromos(); renderList();
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.sw) { state[e.target.dataset.sw] = e.target.checked; save(); renderFilters(); renderList(); }
  if (e.target.id === "sortSel") { state.sort = e.target.value; save(); renderList(); }
});

// ------------------------------------------------------------------ load
async function load() {
  renderChrome();
  try {
    const [r, s, p] = await Promise.all([fetch("data/offers.json", { cache: "no-cache" }), fetch("data/space.json", { cache: "no-cache" }).catch(() => null), fetch("data/promos.json", { cache: "no-cache" }).catch(() => null)]);
    DATA = await r.json();
    if (s && s.ok) Object.assign(SPACE, await s.json());
    if (p && p.ok) PROMOS = await p.json();
  } catch (e) { $("list").innerHTML = `<div class="empty">${t("loadErr")}</div>`; return; }
  renderAll();
}
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>

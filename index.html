<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery</title>
<meta name="description" content="Where to shop today, what to buy, what to stock up on.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grocery">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f3f5f4; --card: #ffffff; --text: #13201c; --muted: #5d6c67; --line: #e3e8e6; --soft: #eef2f0;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dff1ee;
    --good: #166534; --good-soft: #dcf2e3; --warn: #92400e; --warn-soft: #fbefdc; --bad: #9f1239; --bad-soft: #fbe4ea;
    --info: #1e4e8c; --info-soft: #e2ecf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1311; --card: #141e1b; --text: #e5eeea; --muted: #94a49f; --line: #23302c; --soft: #1a2622;
      --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #123430;
      --good: #86efac; --good-soft: #13301f; --warn: #fcd34d; --warn-soft: #33270e; --bad: #fda4af; --bad-soft: #3a1720;
      --info: #9cc3f5; --info-soft: #172a42;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; flex: none; }
  .brand h1 { font-size: 1.2rem; margin: 0; }
  .brand small { display: block; color: var(--muted); font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 0.88rem; font-weight: 600; padding: 7px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg.full { display: flex; width: 100%; }
  .seg.full button { flex: 1; padding: 7px 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 1.02rem; margin: 0 0 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.86rem; }
  .tiny { font-size: 0.76rem; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
  .switch { position: relative; width: 48px; height: 29px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; width: 23px; height: 23px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(19px); }
  .atrow { display: flex; align-items: center; gap: 6px; padding-top: 12px; flex-wrap: wrap; }
  .atrow b { margin-right: 2px; }
  details > summary { cursor: pointer; list-style: none; font-weight: 600; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }
  details.card > summary { font-size: 1rem; }
  details.card[open] > summary { margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--soft); font-size: 0.86rem; padding: 6px 11px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .hero { border: 0; background: linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%); color: var(--accent-ink); padding: 16px; }
  .hero .label { font-size: 0.76rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .hero .go { font-size: 1.7rem; font-weight: 800; margin: 2px 0 10px; letter-spacing: -0.01em; line-height: 1.15; }
  .hero .big { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .hero .big b { font-size: 1.45rem; }
  .hero .big span { font-size: 0.84rem; opacity: .9; }
  .hero .x { border: 0; background: rgba(255,255,255,.2); color: inherit; border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { background: rgba(255,255,255,.18); border-radius: 999px; padding: 5px 10px; font-size: 0.82rem; font-weight: 700; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
  .b-good { background: var(--good-soft); color: var(--good); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-info { background: var(--info-soft); color: var(--info); }
  .b-accent { background: var(--accent-soft); color: var(--accent); }
  .shop { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.05rem; margin: 12px 0 2px; }
  .shop .sum { margin-left: auto; font-size: 0.95rem; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; }
  .li { display: grid; grid-template-columns: 30px 1fr auto; gap: 0 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .li > div { min-width: 0; }
  .li.done .nm, .li.done .sub, .li.done .pr { text-decoration: line-through; opacity: .45; }
  .ck { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; margin-top: 1px; }
  .li.done .ck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ico { width: 26px; text-align: center; font-size: 1.1rem; margin-top: 1px; }
  .nm { font-weight: 650; cursor: pointer; }
  .sub { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .pr { text-align: right; font-weight: 700; white-space: nowrap; }
  .qty { font-weight: 600; color: var(--muted); font-size: 0.86rem; margin-left: 4px; }
  .more { grid-column: 2 / 4; margin-top: 8px; background: var(--soft); border-radius: 12px; padding: 10px; font-size: 0.84rem; }
  .more .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 10px; font-size: 0.84rem; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .btn.ghost { background: transparent; }
  .linkrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; cursor: pointer; font-weight: 650; }
  .linkrow span.arrow { color: var(--muted); font-size: 1.2rem; }
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .addrow:first-of-type { border-top: 0; }
  .addrow .t { font-weight: 650; }
  .addrow .m { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .addrow .acts { display: flex; flex-direction: column; gap: 6px; }
  .meal { padding: 10px 0; border-top: 1px solid var(--line); }
  .meal:first-of-type { border-top: 0; }
  .meal .t { font-weight: 700; }
  .meal .per { font-weight: 800; color: var(--warn); white-space: nowrap; }
  .calc { margin-top: 6px; font-size: 0.82rem; }
  .calc .row { padding: 2px 0; }
  .idea { background: var(--warn-soft); border-color: transparent; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 4px 0; }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .prow { padding: 8px 0; border-top: 1px solid var(--line); }
  .prow:first-of-type { border-top: 0; }
  .sec { font-weight: 800; font-size: 0.95rem; margin: 12px 0 2px; }
  .sec:first-child { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  th, td { text-align: left; padding: 7px 5px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem; border-top: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.best td { font-weight: 700; }
  .why { margin: 0; padding-left: 18px; }
  .why li { margin: 4px 0; font-size: 0.88rem; }
  .deal { padding: 10px 0; border-top: 1px solid var(--line); }
  .deal:first-of-type { border-top: 0; }
  .deal .t { font-weight: 700; }
  .deal .m { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  input[type=search], input[type=number] { font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  input[type=search] { width: 100%; }
  input[type=number] { width: 92px; text-align: right; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .setrow:first-of-type { border-top: 0; }
  nav.tabs { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  nav.tabs button { border: 0; background: transparent; color: var(--muted); font-size: 0.7rem; font-weight: 600; padding: 4px 2px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  .page { display: none; }
  .page.on { display: block; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>

<div class="wrap">

  </header>

  <div class="seg full" id="city" style="margin-bottom:10px"><button data-v="brno">Brno</button><button data-v="kezmarok">Kežmarok</button></div>

  <section class="page" id="p-plan">
    <div class="card">

    <div id="planOut"><div class="loading">…</div></div>
  </section>
  <section class="page" id="p-deals"><div id="dealsOut"></div></section>
  <section class="page" id="p-stock"><div id="stockOut"></div></section>
  <section class="page" id="p-prices"><div class="card"><input type="search" id="q"></div><div id="pricesOut"></div></section>
  <section class="page" id="p-drug"><div id="drugOut"></div></section>
  <section class="page" id="p-set"><div id="setOut"></div></section>
</div>
<div class="toast" id="toast"></div>

<nav class="tabs"><div class="in">
  <button data-p="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span data-t="tPlan"></span></button>
  <button data-p="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span data-t="tDeals"></span></button>
  <button data-p="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span data-t="tStock"></span></button>
  <button data-p="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span data-t="tPrices"></span></button>
  <button data-p="drug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4l2 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/><path d="M9 13h6"/></svg><span data-t="tDrug"></span></button>
</div></nav>

function shortName(id) { return (SHORT[state.lang] || SHORT.en)[id] || iname(BYID[id]); }
let MEAL_CACHE = null;
function mealIdeas(n = 5) {

  if (MEAL_CACHE && MEAL_CACHE.key === key) return MEAL_CACHE.v.slice(0, n);
  const cheap = (id) => { const o = offersFor(id).filter((x) => x.conf !== "low").sort((a, b) => a.unit_price - b.unit_price)[0]; return o ? o.unit_price : null; };
  const vegs = MEAL_VEGS.filter(([id]) => BYID[id] && cheap(id) != null).sort((a, b) => cheap(a[0]) * a[1] - cheap(b[0]) * b[1]).slice(0, 5);
  const sweetDeal = offersFor("sweet_potato").some((o) => o.promo && discount(o) >= state.set.stockPct / 100);
  const carbs = MEAL_CARBS.filter((c) => c.every(([id]) => BYID[id] && (cheap(id) != null || usual(id) != null)) && (c[0][0] !== "sweet_potato" || sweetDeal));
  const cands = [];

      const parts = [[pid, pq], ...c, v];

      if (!opts.length) continue;
      const { rec } = pickRoute(opts);
      if (rec.lines.some((l) => l.missing)) continue;
      cands.push({ key: parts.map((x) => x[0]).join("+"), fam, parts: parts.map(([id, q]) => ({ id, qty: q })), rec, total: rec.total, per: rec.total / 4 });

  const ok = (c, cap) => (used["s:" + side(c)] || 0) < cap && (used["v:" + veg(c)] || 0) < cap;
  const take = (c) => { fams.add(c.fam); keys.add(c.key); out.push(c); used["s:" + side(c)] = (used["s:" + side(c)] || 0) + 1; used["v:" + veg(c)] = (used["v:" + veg(c)] || 0) + 1; };
  for (const cap of [2, 3, 99]) for (const c of cands) { if (out.length >= 5) break; if (!fams.has(c.fam) && !keys.has(c.key) && ok(c, cap)) take(c); }

// ============================================================ price rhythm (learned from history)
function rhythm(id) {
  const H = HIST?.[state.city]?.[id]; if (!H) return null;
  const byDate = {};
  for (const rows of Object.values(H)) for (const r of rows) { const v = r[3] ?? r[1]; if (v != null && (byDate[r[0]] == null || v < byDate[r[0]])) byDate[r[0]] = v; }
  const dates = Object.keys(byDate).sort(), n = dates.length, u = usual(id);
  if (n < 21 || !u) return { n, learning: true };
  const promo = dates.filter((d) => byDate[d] <= u * 0.85);
  const eps = []; let c = null;
  for (const d of promo) { if (c && daysBetween(c.end, d) <= 2) { c.end = d; c.min = Math.min(c.min, byDate[d]); } else { c = { start: d, end: d, min: byDate[d] }; eps.push(c); } }
  if (!eps.length) return { n, none: true };
  const gaps = eps.slice(1).map((e, i) => daysBetween(eps[i].start, e.start));
  const every = gaps.length ? Math.round(median(gaps)) : null, typical = median(eps.map((e) => e.min));
  const last = eps[eps.length - 1], now = daysBetween(last.end, today) <= 1;
  return { n, every, typical, now, nextIn: every && !now ? Math.max(0, every - daysBetween(last.start, today)) : null };
}
function histDays() {
  const H = HIST?.[state.city]; if (!H) return 0;
  const s = new Set(); for (const it of Object.values(H)) for (const rows of Object.values(it)) for (const r of rows) s.add(r[0]);
  return s.size;
}
function rhythmTxt(id) {
  const r = rhythm(id); if (!r || r.learning || r.none) return "";
  const bits = [];
  if (r.now) bits.push(t("rhythmNow")); else if (r.nextIn != null) bits.push(t("rhythmNext", { n: r.nextIn }));
  if (r.every) bits.push(t("rhythmEvery", { n: r.every }));
  if (r.typical) bits.push(t("rhythmTypical", { p: money(r.typical) + "/" + uName(BYID[id].unit) }));
  return "📈 " + bits.join(" · ");
}

// ============================================================ share
function shareText() {
  const r = LAST; if (!r?.rec) return "";
  const D = day(), lines = [`🛒 Grocery · ${dayTxt(today)}`];
  for (const s of r.rec.shops) {
    const ls = r.rec.lines.filter((l) => l.shop === s && !l.missing); if (!ls.length) continue;
    lines.push("", `${SHOP[s].toUpperCase()} — ${money(ls.reduce((a, l) => a + l.cost, 0))}`);
    for (const l of ls) lines.push(`${D.done.includes(l.b.it.id) ? "☑" : "☐"} ${iname(l.b.it)} ${amountTxt(l)} — ${money(l.cost)}${l.o ? ` (${l.o.name})` : ""}`);
  }
  lines.push("", `${t("pay")}: ${money(r.rec.total)}`);
  return lines.join("\n");
}
async function doShare() {
  const text = shareText(); if (!text) return;
  try { if (navigator.share) { await navigator.share({ title: "Grocery", text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast(t("copied")); } catch (e) { toast("—"); }
}

// ============================================================ events
function step(id) {
  const it = BYID[id], o = LAST?.rec?.lines.find((l) => l.b.it.id === id)?.o;
  return o && !byWeight(o) ? o.pack : it.unit === "ks" ? 1 : 0.25;
}
function tick(id) {
  const D = day(), key = `${today}|${state.city}|${id}`, it = BYID[id];
  if (D.done.includes(id)) {
    D.done = D.done.filter((x) => x !== id);
    const e = unlog(key); if (e && e.stk) addStock(id, -e.stk, 0, true);
    return;
  }
  D.done.push(id);
  const Ln = LINES[id]; if (!Ln) return;
  let stk = 0;
  if (it && it.shelf !== "fresh" && (weeklyOf(it) > 0 || D.add[id])) {
    stk = Math.max(0, Ln.qty - (it.group === "pantry" ? 0 : Ln.needBase));
    if (stk > 1e-6) addStock(id, stk, it.group === "pantry" ? 0 : horizon(), true); else stk = 0;
  }
  if (state.low.includes(id)) state.low = state.low.filter((x) => x !== id);
  logPurchase(key, { d: today, c: state.city, i: id, s: Ln.shop, q: Ln.qty, cost: Ln.cost, base: Ln.base, stk });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-open], [data-mealpick], .linkrow"); if (!b) return;
  const D = day();
  const seg = b.closest(".seg");
  if (seg && b.dataset.v) { state[seg.id] = b.dataset.v; OPEN = null; MEAL_CACHE = null; save(); renderAll(); return; }
  if (b.id === "gear") { state.tab = state.tab === "set" ? "plan" : "set"; save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.p) { state.tab = b.dataset.p; save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.at) { state.at = state.at === b.dataset.at ? null : b.dataset.at; OPEN = null; save(); renderPlan(); window.scrollTo(0, 0); return; }
  if (b.dataset.done) { tick(b.dataset.done); save(); renderPlan(); renderStock(); return; }
  if (b.dataset.open) { OPEN = OPEN === b.dataset.open ? null : b.dataset.open; renderPlan(); return; }
  if (b.id === "shareBtn") { doShare(); return; }
  if (b.dataset.q) {
    const id = b.dataset.id, cur0 = LAST?.rec?.lines.find((l) => l.b.it.id === id)?.b.need || 0, st = step(id), dir = b.dataset.q === "+" ? 1 : -1;
    if (D.add[id] != null) D.add[id] = Math.max(0, D.add[id] + dir * st); else D.qty[id] = Math.max(0, cur0 + dir * st);
    if (cur0 + dir * st <= 0) D.skip.push(id);
    save(); renderPlan(); return;
  }
  if (b.dataset.skip) {
    const id = b.dataset.skip;
    if (LAST?.bask?.find((x) => x.it.id === id && x.auto)) D.drop.push(id); else { D.skip.push(id); delete D.add[id]; delete D.swap[id]; }
    OPEN = null; save(); renderPlan(); return;
  }
  if (b.dataset.hide) { state.hide.push(b.dataset.hide); OPEN = null; MEAL_CACHE = null; save(); renderAll(); return; }
  if (b.dataset.swap) {
    const [from, to, need] = b.dataset.swap.split("|");
    D.skip.push(from); D.swap[to] = (D.swap[to] || 0) + (+need); D.skip = D.skip.filter((x) => x !== to);
    save(); renderPlan(); return;
  }
  if (b.id === "addItemBtn") { ADDING = !ADDING; renderPlan(); return; }
  if (b.dataset.additem) {
    const it = BYID[b.dataset.additem];
    D.skip = D.skip.filter((x) => x !== it.id); D.drop = D.drop.filter((x) => x !== it.id);
    D.add[it.id] = (D.add[it.id] || 0) + (it.deal_qty || (weeklyOf(it) > 0 ? weeklyOf(it) / 2 : (it.unit === "ks" ? 1 : 0.5)));
    ADDING = false; save(); renderPlan(); return;
  }
  if (b.dataset.adddeal) {
    const id = b.dataset.adddeal;
    if (D.add[id]) delete D.add[id]; else { D.add[id] = +b.dataset.qty; D.skip = D.skip.filter((x) => x !== id); D.drop = D.drop.filter((x) => x !== id); }
    save(); renderPlan(); renderStock(); return;
  }
  if (b.dataset.bought) {
    const id = b.dataset.bought, key = `${today}|${state.city}|${id}|stock`;
    const ex = unlog(key);
    if (ex) addStock(id, -ex.stk);
    else {
      const d = deals().find((x) => x.it.id === id); if (!d) return;
      logPurchase(key, { d: today, c: state.city, i: id, s: d.o.shop, q: d.qty, cost: d.cost, base: Math.max(d.cost, d.ref * d.qty), stk: d.qty });
      addStock(id, d.qty, 0);
      delete D.add[id];
    }
    save(); renderPlan(); renderStock(); return;
  }
  if (b.dataset.st) {
    const id = b.dataset.id, it = BYID[id];
    if (b.dataset.st === "x") delete stockMap()[id]; else addStock(id, (b.dataset.st === "+" ? 1 : -1) * stockStep(it));
    save(); renderPlan(); renderStock(); return;
  }
  if (b.dataset.stadd) { const it = BYID[b.dataset.stadd]; addStock(it.id, stockStep(it) * 2); save(); renderPlan(); renderStock(); return; }
  if (b.dataset.meal != null) {
    const m = LAST_MEALS[+b.dataset.meal]; if (!m) return;
    for (const p of m.parts) { D.add[p.id] = (D.add[p.id] || 0) + p.qty; D.skip = D.skip.filter((x) => x !== p.id); }
    state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.mealgo != null) {
    const m = LAST_MEALS[+b.dataset.mealgo]; if (!m) return;
    state.mode = "lunch"; state.at = null; D.meals = [{ key: m.key, parts: m.parts.map((p) => [p.id, p.qty]) }];
    state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.mealpick != null) {
    if (e.target.closest("summary, details")) return;
    const m = LAST_MEALS[+b.dataset.mealpick]; if (!m) return;
    const has = D.meals.find((x) => x.key === m.key);
    D.meals = has ? D.meals.filter((x) => x.key !== m.key) : D.meals.concat({ key: m.key, parts: m.parts.map((p) => [p.id, p.qty]) });
    save(); renderPlan(); return;
  }
  if (b.dataset.dlow) { const id = b.dataset.dlow; state.drugLow = state.drugLow.includes(id) ? state.drugLow.filter((x) => x !== id) : state.drugLow.concat(id); save(); renderDrug(); return; }
});
$("gym").addEventListener("change", (e) => { state.gym = e.target.checked; MEAL_CACHE = null; save(); renderPlan(); renderDeals(); });
$("q").addEventListener("input", renderPrices);

// ============================================================ load
async function load() {
  renderChrome();
  try {
    const [ci, pr] = await Promise.all([fetch("config/items.json", { cache: "no-cache" }), fetch("data/prices.json", { cache: "no-cache" })]);
    if (!ci.ok || !pr.ok) throw new Error("http");
    ITEMS = (await ci.json()).items; BYID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
    PRICES = await pr.json();
  } catch (e) { PRICES = null; }
  try { const h = await fetch("data/history.json", { cache: "no-cache" }); if (h.ok) HIST = await h.json(); } catch (e) {}
  if (!["plan", "deals", "stock", "prices", "drug"].includes(state.tab)) state.tab = "plan";
  day(); cleanStock(); save();
  renderAll();
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
load();
</script>

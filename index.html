<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery</title>
<meta name="description" content="Where to shop today, what to buy, what to stock up on.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eceeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grocery">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* One colour = one meaning: ink = action/selected, green = money saved, amber = check this. Everything else is neutral. */
  :root {
    --bg: #eceeec; --card: #ffffff; --text: #1a1f1c; --muted: #646d69; --line: #e0e4e1; --soft: #f2f4f2;
    --save: #1b7546; --save-soft: #e1f2e8; --warn: #9a5200; --warn-soft: #fbefdc;
    --btn: #1a1f1c; --btn-ink: #ffffff; --focus: #2a6fdb; --seg-on: #ffffff;
    --good: var(--save); --bad: var(--warn); --accent: var(--text);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1211; --card: #181c1a; --text: #e8ece9; --muted: #9aa39e; --line: #2a302d; --soft: #202523;
      --save: #72d29e; --save-soft: #16301f; --warn: #f0b35a; --warn-soft: #33270e;
      --btn: #e8ece9; --btn-ink: #121514; --focus: #7fb0ff; --seg-on: #4b5550;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)); }

  /* header: name + when prices were checked · city · settings */
  header.top { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
  .brand { min-width: 0; flex: 1; }
  .brand h1 { font-size: 1.15rem; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .brand small { display: block; color: var(--muted); font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { border: 0; background: transparent; border-radius: 12px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; color: var(--muted); }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn.on { color: var(--text); background: color-mix(in srgb, var(--text) 9%, transparent); }

  /* segmented controls */
  .seg { display: inline-flex; background: color-mix(in srgb, var(--text) 7%, transparent); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 0.88rem; font-weight: 650; padding: 7px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; min-height: 36px; }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .seg.full { display: flex; width: 100%; }
  .seg.full button { flex: 1; padding: 7px 4px; }
  .seg.mode button { display: flex; flex-direction: column; align-items: center; line-height: 1.15; padding: 7px 4px 6px; font-size: 0.94rem; }
  .seg.mode small { font-size: 0.72rem; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .controls { margin-bottom: 14px; }
  .opts > summary { font-size: 0.86rem; color: var(--muted); padding: 10px 2px 0; font-weight: 600; }
  .opts > summary b { color: var(--text); font-weight: 650; }
  .optrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px 0; font-size: 0.92rem; font-weight: 600; }
  .optrow .seg button { font-size: 0.82rem; padding: 6px 10px; min-height: 32px; }

  /* cards */
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 2px; font-weight: 750; letter-spacing: -0.005em; }
  .card .lead-in { color: var(--muted); font-size: 0.82rem; margin: 0 0 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); }
  .row > b:last-child, .row > .per { white-space: nowrap; flex: none; }
  .small { font-size: 0.86rem; }
  .tiny { font-size: 0.76rem; }
  .save-t { color: var(--save); }
  .warn-t { color: var(--warn); }
  .switch { position: relative; width: 48px; height: 29px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: color-mix(in srgb, var(--text) 18%, transparent); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; width: 23px; height: 23px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + span { background: var(--btn); }
  .switch input:checked + span::after { transform: translateX(19px); background: var(--btn-ink); }
  .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  details > summary { cursor: pointer; list-style: none; font-weight: 650; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: ""; display: inline-block; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 0 3px 8px; transition: transform .15s; }
  details[open] > summary::after { transform: rotate(-135deg); margin-bottom: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); font-size: 0.88rem; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-weight: 650; min-height: 36px; }
  .chip.on { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }

  /* the shopping slip: the one answer — where to go, what you pay, what you save */
  .slip { position: relative; background: var(--card); border-radius: 16px 16px 0 0; padding: 14px 16px 14px; margin-bottom: 24px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.06)); }
  .slip::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: conic-gradient(from -45deg at bottom, var(--card) 90deg, transparent 0) 50% / 16px 100%; }
  .slip .lbl { font-size: 0.84rem; color: var(--muted); font-weight: 600; }
  .slip .go { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; margin: 0 0 10px; }
  .slip .go .via { color: var(--muted); font-weight: 600; }
  .lead { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
  .lead > span { color: var(--muted); font-weight: 600; font-size: 0.95rem; }
  .lead > i { flex: 1; border-bottom: 2px dotted color-mix(in srgb, var(--text) 22%, transparent); transform: translateY(-4px); min-width: 12px; }
  .lead > b { font-size: 1.12rem; font-weight: 750; white-space: nowrap; }
  .lead.pay > b { font-size: 1.4rem; font-weight: 800; }
  .lead.saved > b { color: var(--save); }
  .slip .foot { border-top: 1.5px dashed color-mix(in srgb, var(--text) 20%, transparent); margin-top: 10px; padding-top: 9px; display: grid; gap: 5px; font-size: 0.86rem; }
  .slip .foot .m { color: var(--muted); }
  .slip .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tip { font-weight: 600; }
  .tip b { font-weight: 750; }

  /* flags: at most one per line, two colours only */
  .flag { display: inline-block; font-size: 0.74rem; font-weight: 750; padding: 1px 6px; border-radius: 6px; white-space: nowrap; vertical-align: 1px; }
  .flag.s { color: var(--save); background: var(--save-soft); }
  .flag.w { color: var(--warn); background: var(--warn-soft); }
  .flag.n { color: var(--muted); background: var(--soft); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--soft); color: var(--muted); white-space: nowrap; vertical-align: 1px; }

  /* shopping list */
  .listhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .atline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 2px; }
  .atline > span { font-size: 0.84rem; color: var(--muted); font-weight: 600; margin-right: 2px; }
  .atline .chip { padding: 5px 11px; min-height: 32px; font-size: 0.84rem; }
  .shop { position: sticky; top: 0; z-index: 2; background: var(--card); display: flex; align-items: baseline; gap: 8px; font-weight: 800; font-size: 1.02rem; margin: 10px -16px 0; padding: 10px 16px 6px; }
  .shop .sum { margin-left: auto; font-size: 0.95rem; font-weight: 750; }
  .li { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 8px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line); }
  .li > div { min-width: 0; }
  .li.done .nm, .li.done .sub, .li.done .pr { opacity: .4; }
  .li.done .nm { text-decoration: line-through; }
  .ck { width: 56px; min-height: 48px; align-self: stretch; margin: -11px 0 -11px -16px; padding: 9px 0 0 16px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-start; justify-content: flex-start; }
  .ck > span { width: 24px; height: 24px; border-radius: 7px; border: 2px solid color-mix(in srgb, var(--text) 28%, transparent); display: grid; place-items: center; font-size: 0.9rem; font-weight: 800; line-height: 1; }
  .li.done .ck > span { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .ico { width: 24px; }
  .nm { font-weight: 650; cursor: pointer; line-height: 1.3; }
  .sub { font-size: 0.8rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; cursor: pointer; margin-top: 1px; }
  .sub .tag { color: var(--text); font-weight: 600; }
  .pr { text-align: right; font-weight: 700; white-space: nowrap; }
  .pr .est { color: var(--muted); font-weight: 800; margin-right: 3px; }
  .pr .flag { display: table; margin: 4px 0 0 auto; }
  .qty { white-space: nowrap; font-weight: 500; color: var(--muted); font-size: 0.86rem; margin-left: 5px; }
  .more { grid-column: 2 / 4; margin-top: 8px; background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 0.84rem; display: grid; gap: 3px; }
  .more .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .legend { font-size: 0.76rem; color: var(--muted); margin: 6px 0 0; }
  .aisle { font-size: 0.76rem; color: var(--muted); font-weight: 650; padding: 10px 0 2px; }
  .progress { font-size: 0.8rem; font-weight: 650; color: var(--muted); }
  .sec { font-weight: 750; font-size: 0.92rem; margin: 16px 0 2px; }
  .sec:first-child { margin-top: 0; }
  .sec .muted { font-weight: 500; }

  /* buttons: one filled button per screen at most */
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-size: 0.86rem; font-weight: 650; cursor: pointer; white-space: nowrap; min-height: 36px; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .btn.wide { width: 100%; min-height: 46px; font-size: 0.98rem; margin-top: 12px; }
  .btn.done { background: transparent; color: var(--save); border-color: transparent; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--text) 30%, transparent); text-underline-offset: 3px; }
  .btn.quiet { border-color: transparent; background: var(--soft); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }

  /* grouped link rows (secondary destinations) */
  .group { padding: 0; overflow: hidden; }
  button.linkrow { width: 100%; border: 0; background: transparent; text-align: left; color: inherit; font: inherit; }
  .card.group > * + * { border-top: 1px solid var(--line); }
  .linkrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 16px; cursor: pointer; font-weight: 600; font-size: 0.94rem; }
  .linkrow .m { display: block; font-weight: 500; font-size: 0.8rem; color: var(--muted); margin-top: 1px; }
  .linkrow span.arrow { color: var(--muted); font-size: 1.3rem; line-height: 1; }
  .group details > summary { padding: 13px 16px; font-weight: 600; font-size: 0.94rem; }
  .group details > div { padding: 0 16px 14px; }

  /* rows with an action on the right */
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .addrow:first-of-type { border-top: 0; }
  .lead-in + .addrow { border-top: 0; }
  .addrow .t { font-weight: 650; }
  .addrow .m { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .addrow .acts { flex-direction: column; align-items: stretch; }

  /* meals */
  .meal { padding: 12px 0; border-top: 1px solid var(--line); }
  .meal:first-of-type, .lead-in + .meal { border-top: 0; }
  .meal.day { display: grid; grid-template-columns: 44px 1fr; gap: 0 6px; }
  .meal .d span { font-weight: 500; }
  .meal .d { font-weight: 750; font-size: 0.86rem; color: var(--muted); padding-top: 1px; }
  .meal .t { font-weight: 700; line-height: 1.3; }
  .meal .per { font-weight: 750; white-space: nowrap; text-align: right; }
  .meal .per small { display: block; font-weight: 500; font-size: 0.72rem; color: var(--muted); }
  .meal .hl { font-size: 0.84rem; margin-top: 3px; }
  .meal .hl b { font-weight: 700; }
  .meal details { margin-top: 6px; }
  .meal details > summary { font-size: 0.84rem; color: var(--muted); }
  .meal details > div { margin-top: 6px; font-size: 0.84rem; display: grid; gap: 4px; }
  .meal.pick { cursor: pointer; display: grid; grid-template-columns: 34px 1fr; gap: 0 8px; }
  .meal.pick .ck { margin: -10px 0 -10px -10px; }
  .meal.pick.on .ck > span { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .calc { display: grid; gap: 3px; }
  .calc .row { align-items: flex-start; }
  .total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }

  /* nutrients */
  .who { padding: 10px 0; border-top: 1px solid var(--line); }
  .who:first-of-type, .lead-in + .who { border-top: 0; }
  .who .row b { font-weight: 750; }
  .fix { font-size: 0.86rem; padding: 3px 0; }
  .nrow { display: grid; grid-template-columns: 74px 1fr 44px; gap: 8px; align-items: center; font-size: 0.82rem; padding: 2px 0; }
  .nrow b { text-align: right; font-weight: 650; }
  .bar { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: color-mix(in srgb, var(--text) 55%, transparent); }
  .bar > i.low { background: var(--warn); }

  .empty { color: var(--muted); font-size: 0.9rem; padding: 4px 0; }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .prow { padding: 10px 0; border-top: 1px solid var(--line); }
  .prow:first-of-type, .lead-in + .prow { border-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  th, td { text-align: left; padding: 7px 5px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem; border-top: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.best td { font-weight: 750; }
  .why { margin: 0; padding-left: 18px; }
  .why li { margin: 4px 0; font-size: 0.88rem; }
  .deal { padding: 10px 0; border-top: 1px solid var(--line); }
  .deal:first-of-type, .lead-in + .deal { border-top: 0; }
  .deal .t { font-weight: 650; }
  .deal .m { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  input[type=search], input[type=number] { font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 40px; }
  input[type=search] { width: 100%; }
  input[type=number] { width: 92px; text-align: right; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .setrow:first-of-type, h2 + .setrow { border-top: 0; }

  /* bottom navigation: 5 places */
  nav.tabs { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 96%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  nav.tabs button { border: 0; background: transparent; color: var(--muted); font-size: 0.72rem; font-weight: 650; padding: 2px 2px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; }
  nav.tabs button svg { width: 22px; height: 22px; padding: 4px 16px; box-sizing: content-box; border-radius: 999px; }
  nav.tabs button.on { color: var(--text); }
  nav.tabs button.on svg { background: color-mix(in srgb, var(--text) 10%, transparent); }
  .page { display: none; }
  .page.on { display: block; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 0.88rem; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="title">Grocery</h1><small id="updated">…</small></div>
    <div class="seg" id="city"><button data-v="brno">Brno</button><button data-v="kezmarok">Kežmarok</button></div>
    <button class="iconbtn" id="gear" aria-label="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <section class="page" id="p-plan">
    <div class="controls" id="controls">
      <div class="seg full mode" id="mode"><button data-v="quick"><span data-t="quick"></span><small data-t="quickSub"></small></button><button data-v="big"><span data-t="big"></span><small data-t="bigSub"></small></button><button data-v="lunch"><span data-t="lunchMode"></span><small data-t="lunchSub"></small></button></div>
      <details class="opts" id="opts"><summary id="optsSum"></summary>
      <label class="optrow" id="gymRow"><span data-t="gym"></span><span class="switch"><input type="checkbox" id="gym"><span></span></span></label>
      <div class="optrow" id="lpRow"><span data-t="lpLabel"></span><div class="seg" id="lpSeg"><button data-lp="health" data-t="lpHealth"></button><button data-lp="usual" data-t="lpUsual"></button></div></div>
      </details>
    </div>
    <div id="planOut"><div class="loading">…</div></div>
  </section>
  <section class="page" id="p-health"><div id="healthOut"></div></section>
  <section class="page" id="p-deals"><div id="dealsOut"></div></section>
  <section class="page" id="p-stock"><div id="stockOut"></div></section>
  <section class="page" id="p-prices"><div class="seg full" id="pview" style="margin-bottom:12px"><button data-pv="food" data-t="food"></button><button data-pv="drug" data-t="tDrug"></button></div><div id="foodView"><div class="card"><input type="search" id="q"></div><div id="pricesOut"></div></div><div id="drugOut"></div></section>
  <section class="page" id="p-set"><div id="setOut"></div></section>

  for (const d of promo) { if (c && daysBetween(c.end, d) <= 2) { c.end = d; c.min = Math.min(c.min, byDate[d]); } else { c = { start: d, end: d, min: byDate[d] }; eps.push(c); } }

  const wk = ITEMS.filter((it) => it.group !== "drugstore" && it.group !== "extras").map((it) => `<div class="setrow"><span>${esc(iname(it))} <span class="tiny muted">${uName(it.unit)} ${t("perWeek")}${learned(it.id) != null && state.weekly[it.id] == null ? ` · ${t("learnedTag")}` : ""}</span></span><input type="number" step="0.05" min="0" data-wk="${it.id}" value="${weeklyOf(it)}"></div>`).join("");
  $("setOut").innerHTML = `<div class="card"><h2>${t("settings")}</h2>
    <div class="setrow"><span>${t("language")}</span><div class="seg" id="lang">${["en", "sk"].map((v) => `<button data-v="${v}" class="${state.lang === v ? "on" : ""}">${v === "en" ? "English" : "Slovenčina"}</button>`).join("")}</div></div>
    <div class="setrow"><span>${t("stopTh")} (Brno, Kč)</span><input type="number" data-set="stopBrno" value="${s.stopBrno}"></div>
    <div class="setrow"><span>${t("tripTh")} (Brno, Kč)</span><input type="number" data-set="tripBrno" value="${s.tripBrno}"></div>
    <div class="setrow"><span>${t("stopTh")} (Kežmarok, €)</span><input type="number" data-set="stopKk" value="${s.stopKk}"></div>
    <div class="setrow"><span>${t("tripTh")} (Kežmarok, €)</span><input type="number" data-set="tripKk" value="${s.tripKk}"></div>
    <div class="setrow"><span>${t("stockPct")}</span><input type="number" data-set="stockPct" value="${s.stockPct}"></div>
    <div class="setrow"><span>${t("alertPct")}</span><input type="number" data-set="alertPct" value="${s.alertPct}"></div>
    <label class="setrow"><span>${t("learnSet")}</span><span class="switch"><input type="checkbox" id="learnSw" ${state.set.learn !== false ? "checked" : ""}><span></span></span></label>
    <div class="setrow"><span>${t("cooksSet")}</span><input type="number" min="2" max="5" data-set="cooks" value="${s.cooks}"></div>
    <div class="setrow"><span>${t("extrasSet")}</span><div class="seg" id="extrasSeg">${["auto", "suggest", "off"].map((v) => `<button data-ex="${v}" class="${s.extras === v ? "on" : ""}">${t("ex_" + v)}</button>`).join("")}</div></div>
    <div style="margin-top:8px"><button class="btn" id="resetSet">${t("reset")}</button></div></div>
    <details class="card"><summary>${t("weekly")}</summary>${wk}<div style="margin-top:8px"><button class="btn" id="resetWk">${t("reset")}</button></div></details>
    <div class="card"><h2>${t("data")}</h2><div class="small muted">${PRICES ? t("checkedAt", { d: dtTxt(PRICES.generated) }) : "—"}</div>${rows}
      ${state.hide.length ? `<div style="margin-top:10px" class="row"><span class="small">${t("hiddenN", { n: state.hide.length })}</span><button class="btn" id="unhide">${t("restore")}</button></div>` : ""}</div>
    <div class="card"><h2>${t("howWorks")}</h2><div class="small">${t("howText")}</div></div>`;
  $("setOut").querySelectorAll("input[data-set]").forEach((el) => el.addEventListener("change", () => { state.set[el.dataset.set] = +el.value; MEAL_CACHE = null; save(); renderAll(); }));
  $("setOut").querySelectorAll("input[data-wk]").forEach((el) => el.addEventListener("change", () => { state.weekly[el.dataset.wk] = Math.max(0, +el.value); save(); renderPlan(); renderStock(); }));
  $("learnSw").onchange = (e) => { state.set.learn = e.target.checked; save(); renderAll(); };
  $("resetSet").onclick = () => { state.set = { ...DEFAULTS }; MEAL_CACHE = null; save(); renderAll(); };
  $("resetWk").onclick = () => { state.weekly = {}; save(); renderAll(); };
  if ($("unhide")) $("unhide").onclick = () => { state.hide = []; MEAL_CACHE = null; save(); renderAll(); };
}

function renderChrome() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  for (const id of ["lang", "city", "mode"]) $(id)?.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === state[id]));
  $("gym").checked = !!state.gym;
  $("gear").classList.toggle("on", state.tab === "set");
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.p === state.tab));
  document.querySelectorAll(".page").forEach((p) => p.classList.toggle("on", p.id === "p-" + state.tab));
  $("q").placeholder = t("search");
  $("title").textContent = t({ plan: "tPlan", health: "tHealth", deals: "tDeals", stock: "tStock", prices: "tPrices", set: "tSet" }[state.tab] || "tPlan");
  if (PRICES) $("updated").textContent = t("pricesAt", { d: dtTxt(PRICES.generated) });
}
function renderAll() { renderChrome(); renderPlan(); renderHealth(); renderDeals(); renderStock(); renderPrices(); renderDrug(); renderSettings(); }

// ============================================================ share
function shareText() {
  const r = LAST; if (!r?.rec) return "";
  const D = day(), lines = [`Grocery · ${dayTxt(today)}`];
  for (const s of r.rec.shops) {
    const ls = r.rec.lines.filter((l) => l.shop === s && !l.missing); if (!ls.length) continue;
    lines.push("", `${SHOP[s].toUpperCase()} — ${money(ls.reduce((a, l) => a + l.cost, 0))}`);
    for (const l of ls) lines.push(`${D.done.includes(l.b.it.id) ? "☑" : "☐"} ${iname(l.b.it)} ${amountTxt(l)} — ${money(l.cost)}${l.o ? ` (${l.o.name})` : ""}`);
  }
  lines.push("", `${t("pay")}: ${money(r.rec.total)}`);
  return lines.join("\n");
}
async function doShare() {
  const text = shareText(); if (!text) return;
  try { if (navigator.share) { await navigator.share({ title: "Grocery", text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast(t("copied")); } catch (e) { toast("—"); }
}

// ============================================================ events
function step(id) {
  const it = BYID[id], o = LAST?.rec?.lines.find((l) => l.b.it.id === id)?.o;
  return o && !byWeight(o) ? o.pack : it.unit === "ks" ? 1 : 0.25;
}
function tick(id) {
  const D = day(), key = `${today}|${state.city}|${id}`, it = BYID[id];
  if (D.done.includes(id)) {
    D.done = D.done.filter((x) => x !== id);
    const e = unlog(key); if (e && e.stk) addStock(id, -e.stk, 0, true);
    return;
  }
  D.done.push(id);
  const Ln = LINES[id]; if (!Ln) return;
  let stk = 0;
  if (it && it.shelf !== "fresh" && (weeklyOf(it) > 0 || D.add[id])) {
    stk = Math.max(0, Ln.qty - (it.group === "pantry" ? 0 : Ln.needBase));
    if (stk > 1e-6) addStock(id, stk, it.group === "pantry" ? 0 : horizon(), true); else stk = 0;
  }
  if (state.low.includes(id)) state.low = state.low.filter((x) => x !== id);
  logPurchase(key, { d: today, c: state.city, i: id, s: Ln.shop, q: Ln.qty, cost: Ln.cost, base: Ln.base, stk });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-open], [data-mealpick], .linkrow"); if (!b) return;
  const D = day();
  const seg = b.closest(".seg");
  if (seg && b.dataset.v && ["lang", "city", "mode"].includes(seg.id)) { state[seg.id] = b.dataset.v; OPEN = null; MEAL_CACHE = null; save(); renderAll(); return; }
  if (b.id === "gear") { state.tab = state.tab === "set" ? "plan" : "set"; save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.p) { state.tab = b.dataset.p; if (b.dataset.pv) { state.pv = b.dataset.pv; renderPrices(); } save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.at) { state.at = state.at === b.dataset.at ? null : b.dataset.at; OPEN = null; save(); renderPlan(); window.scrollTo(0, 0); return; }
  if (b.dataset.done) { tick(b.dataset.done); save(); renderPlan(); renderStock(); return; }
  if (b.dataset.open) { OPEN = OPEN === b.dataset.open ? null : b.dataset.open; renderPlan(); return; }
  if (b.id === "shareBtn") { doShare(); return; }
  if (b.dataset.q) {
    const id = b.dataset.id, cur0 = LAST?.rec?.lines.find((l) => l.b.it.id === id)?.b.need || 0, st = step(id), dir = b.dataset.q === "+" ? 1 : -1;
    if (D.add[id] != null) D.add[id] = Math.max(0, D.add[id] + dir * st); else D.qty[id] = Math.max(0, cur0 + dir * st);
    if (cur0 + dir * st <= 0) D.skip.push(id);
    save(); renderPlan(); return;
  }
  if (b.dataset.skip) {
    const id = b.dataset.skip;
    if (LAST?.bask?.find((x) => x.it.id === id && x.auto)) D.drop.push(id); else { D.skip.push(id); delete D.add[id]; delete D.swap[id]; }
    OPEN = null; save(); renderPlan(); return;
  }
  if (b.dataset.hide) { state.hide.push(b.dataset.hide); OPEN = null; MEAL_CACHE = null; save(); renderAll(); return; }
  if (b.dataset.swap) {
    const [from, to, need] = b.dataset.swap.split("|");
    D.skip.push(from); D.swap[to] = (D.swap[to] || 0) + (+need); D.skip = D.skip.filter((x) => x !== to);
    save(); renderPlan(); return;
  }
  if (b.id === "addItemBtn") { ADDING = !ADDING; renderPlan(); return; }
  if (b.dataset.additem) {
    const it = BYID[b.dataset.additem];
    D.skip = D.skip.filter((x) => x !== it.id); D.drop = D.drop.filter((x) => x !== it.id);
    D.add[it.id] = (D.add[it.id] || 0) + (it.deal_qty || (weeklyOf(it) > 0 ? weeklyOf(it) / 2 : (it.unit === "ks" ? 1 : 0.5)));
    ADDING = false; save(); renderPlan(); return;
  }
  if (b.dataset.adddeal) {
    const id = b.dataset.adddeal;
    if (D.add[id]) delete D.add[id]; else { D.add[id] = +b.dataset.qty; D.skip = D.skip.filter((x) => x !== id); D.drop = D.drop.filter((x) => x !== id); }
    save(); renderPlan(); renderHealth(); renderStock(); return;
  }
  if (b.dataset.bought) {
    const id = b.dataset.bought, key = `${today}|${state.city}|${id}|stock`;
    const ex = unlog(key);
    if (ex) addStock(id, -ex.stk);
    else {
      const d = deals().find((x) => x.it.id === id); if (!d) return;
      logPurchase(key, { d: today, c: state.city, i: id, s: d.o.shop, q: d.qty, cost: d.cost, base: Math.max(d.cost, d.ref * d.qty), stk: d.qty });
      addStock(id, d.qty, 0);
      delete D.add[id];
    }
    save(); renderPlan(); renderStock(); return;
  }
  if (b.dataset.st) {
    const id = b.dataset.id, it = BYID[id];
    if (b.dataset.st === "x") delete stockMap()[id]; else addStock(id, (b.dataset.st === "+" ? 1 : -1) * stockStep(it));
    save(); renderPlan(); renderStock(); return;
  }
  if (b.dataset.stadd) { const it = BYID[b.dataset.stadd]; addStock(it.id, stockStep(it) * 2); save(); renderPlan(); renderStock(); return; }
  if (b.dataset.meal != null) {
    const m = LAST_MEALS[+b.dataset.meal]; if (!m) return;
    for (const p of m.parts) { D.add[p.id] = (D.add[p.id] || 0) + p.qty; D.skip = D.skip.filter((x) => x !== p.id); }
    state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.mealgo != null) {
    const m = LAST_MEALS[+b.dataset.mealgo]; if (!m) return;
    state.mode = "lunch"; state.at = null; D.lw = false; D.meals = [{ key: m.key, n: m.portions, parts: m.parts.map((p) => [p.id, p.qty]) }];
    state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.mealpick != null) {
    if (e.target.closest("summary, details")) return;
    const m = LAST_MEALS[+b.dataset.mealpick]; if (!m) return;
    const has = D.meals.find((x) => x.key === m.key);
    D.meals = has ? D.meals.filter((x) => x.key !== m.key) : D.meals.concat({ key: m.key, n: m.portions, parts: m.parts.map((p) => [p.id, p.qty]) });
    save(); renderPlan(); return;
  }
  if (b.dataset.ex) { state.set.extras = b.dataset.ex; save(); renderAll(); return; }
  if (b.dataset.learn) { state.set.learn = b.dataset.learn === "on"; save(); renderAll(); return; }
  if (b.dataset.lp) { state.set.lunchPlan = b.dataset.lp; save(); renderPlan(); return; }
  if (b.dataset.lw != null) { D.lw = b.dataset.lw === "1"; D.meals = []; save(); renderPlan(); return; }
  if (b.dataset.weekgo) { state.mode = "lunch"; state.at = null; D.lw = true; D.meals = []; state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return; }
  if (b.dataset.bfadd != null) {
    const bf = BF[+b.dataset.bfadd]; if (!bf) return;
    const need = bf.map(([id, q]) => [id, Math.max(0, q * 7 - (inWeekly(id) ? weeklyOf(BYID[id]) : 0))]).filter(([id, q]) => BYID[id] && q > 1e-6);
    const on = need.length && need.every(([id]) => D.add[id]);
    for (const [id, q] of need) { if (on) delete D.add[id]; else { D.add[id] = +q.toFixed(3); D.skip = D.skip.filter((x) => x !== id); } }
    save(); renderAll(); return;
  }
  if (b.dataset.pv) { state.pv = b.dataset.pv; save(); renderPrices(); return; }
  if (b.dataset.dadd) {
    const id = b.dataset.dadd, it = BYID[id];
    if (D.add[id]) delete D.add[id]; else { D.add[id] = it.unit === "ks" ? 1 : 0.05; D.skip = D.skip.filter((x) => x !== id); }
    save(); renderDrug(); renderPlan(); return;
  }
  if (b.dataset.dlow) { const id = b.dataset.dlow; state.drugLow = state.drugLow.includes(id) ? state.drugLow.filter((x) => x !== id) : state.drugLow.concat(id); save(); renderDrug(); return; }
});
$("gym").addEventListener("change", (e) => { state.gym = e.target.checked; MEAL_CACHE = null; save(); renderPlan(); renderHealth(); renderDeals(); });
$("q").addEventListener("input", renderPrices);

// ============================================================ load
async function load() {
  renderChrome();
  try {
    const [ci, pr] = await Promise.all([fetch("config/items.json", { cache: "no-cache" }), fetch("data/prices.json", { cache: "no-cache" })]);
    if (!ci.ok || !pr.ok) throw new Error("http");
    ITEMS = (await ci.json()).items; BYID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
    PRICES = await pr.json();
  } catch (e) { PRICES = null; }
  try { const h = await fetch("data/history.json", { cache: "no-cache" }); if (h.ok) HIST = await h.json(); } catch (e) {}
  if (state.tab === "drug") { state.tab = "prices"; state.pv = "drug"; }
  if (!["plan", "health", "deals", "stock", "prices"].includes(state.tab)) state.tab = "plan";
  day(); cleanStock(); save();
  renderAll();
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
load();
</script>

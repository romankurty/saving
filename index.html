<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saving</title>
<meta name="description" content="Grocery decisions: where to shop today, what is cheap, what to stock up on.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saving">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f3f5f4; --card: #ffffff; --text: #13201c; --muted: #5d6c67; --line: #e1e7e4; --soft: #eef2f0;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dff1ee;
    --good: #166534; --good-soft: #dcf2e3; --warn: #92400e; --warn-soft: #fbefdc; --bad: #9f1239; --bad-soft: #fbe4ea;
    --info: #1e4e8c; --info-soft: #e2ecf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1311; --card: #141e1b; --text: #e5eeea; --muted: #94a49f; --line: #23302c; --soft: #1a2622;
      --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #123430;
      --good: #86efac; --good-soft: #13301f; --warn: #fcd34d; --warn-soft: #33270e; --bad: #fda4af; --bad-soft: #3a1720;
      --info: #9cc3f5; --info-soft: #172a42;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
  .brand small { display: block; color: var(--muted); font-size: 0.75rem; margin-top: -2px; }
  .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg.full { display: flex; width: 100%; }
  .seg.full button { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  .card h3 { font-size: 0.92rem; margin: 14px 0 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.82rem; }
  .tiny { font-size: 0.74rem; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0 2px; }
  .switch { position: relative; width: 46px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--muted); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--soft); color: var(--text); font: inherit; font-size: 0.8rem; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chip.off { text-decoration: line-through; color: var(--muted); background: transparent; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
  .hero { border: 0; background: linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%); color: var(--accent-ink); }
  .hero .label { font-size: 0.78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .hero .go { font-size: 1.45rem; font-weight: 800; margin: 2px 0 8px; letter-spacing: -0.01em; }
  .hero .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hero .nums div { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 10px; }
  .hero .nums b { display: block; font-size: 1.1rem; }
  .hero .nums span { font-size: 0.74rem; opacity: .9; }
  .hero .cards { margin-top: 10px; font-size: 0.85rem; font-weight: 600; background: rgba(255,255,255,.16); border-radius: 10px; padding: 7px 10px; }
  .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
  .b-good { background: var(--good-soft); color: var(--good); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-info { background: var(--info-soft); color: var(--info); }
  .b-accent { background: var(--accent-soft); color: var(--accent); }
  .shop { display: flex; align-items: center; gap: 8px; font-weight: 700; margin: 6px 0 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .line:first-of-type { border-top: 0; }
  .line .what { font-weight: 600; }
  .line .prod { color: var(--muted); font-size: 0.8rem; }
  .line .cost { text-align: right; font-weight: 700; white-space: nowrap; }
  .line .calc { text-align: right; color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th, td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; border-top: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.best td { font-weight: 700; }
  .why { margin: 6px 0 0; padding-left: 18px; }
  .why li { margin: 4px 0; font-size: 0.86rem; }
  .deal { padding: 10px 0; border-top: 1px solid var(--line); }
  .deal:first-of-type { border-top: 0; }
  .deal .t { font-weight: 700; }
  .deal .m { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .deal .s { font-size: 0.86rem; margin-top: 4px; }
  .idea { background: var(--warn-soft); border-color: transparent; }
  .idea h2 { color: var(--warn); }
  .empty { color: var(--muted); font-size: 0.88rem; padding: 6px 0; }
  input[type=search], input[type=number] { width: 100%; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  input[type=number] { width: 96px; text-align: right; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .setrow:first-of-type { border-top: 0; }
  nav.tabs { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  nav.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.7rem; font-weight: 600; padding: 4px 2px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  .page { display: none; }
  .page.on { display: block; }
  .status { display: flex; flex-wrap: wrap; gap: 6px; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .kpi div { background: var(--soft); border-radius: 12px; padding: 8px 10px; }
  .kpi b { display: block; font-size: 1rem; }
  .kpi span { font-size: 0.72rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div><h1>Saving</h1><small id="updated">…</small></div>
    </div>
    <div class="seg" id="lang"><button data-v="en">EN</button><button data-v="sk">SK</button></div>
  </header>

  <div class="seg full" id="city" style="margin-bottom:12px"><button data-v="brno">Brno</button><button data-v="kezmarok">Kežmarok</button></div>

  <!-- PLAN -->
  <section class="page" id="p-plan">
    <div class="card">
      <div class="seg full" id="mode"><button data-v="quick" data-t="quick"></button><button data-v="big" data-t="big"></button></div>
      <div class="toggle" id="gymRow">
        <div><b data-t="gym"></b><div class="small muted" data-t="gymHint"></div></div>
        <label class="switch"><input type="checkbox" id="gym"><span></span></label>
      </div>
      <details id="haveBox"><summary data-t="haveTitle"></summary><div class="small muted" data-t="haveHint"></div><div class="chips" id="haveChips"></div></details>
      <details id="lowBox"><summary data-t="lowTitle"></summary><div class="small muted" data-t="lowHint"></div><div class="chips" id="lowChips"></div></details>
    </div>
    <div id="planOut"><div class="loading">Loading prices…</div></div>
  </section>

  <!-- DEALS -->
  <section class="page" id="p-deals"><div id="dealsOut"></div></section>

  <!-- PRICES -->
  <section class="page" id="p-prices">
    <div class="card"><input type="search" id="q" placeholder="Search"></div>
    <div id="pricesOut"></div>
  </section>

  <!-- DRUGSTORE -->
  <section class="page" id="p-drug"><div id="drugOut"></div></section>

  <!-- SETTINGS -->
  <section class="page" id="p-set"><div id="setOut"></div></section>
</div>

<nav class="tabs"><div class="in">
  <button data-p="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span data-t="tPlan"></span></button>
  <button data-p="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span data-t="tDeals"></span></button>
  <button data-p="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span data-t="tPrices"></span></button>
  <button data-p="drug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4l2 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/><path d="M9 13h6"/></svg><span data-t="tDrug"></span></button>
  <button data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="tSet"></span></button>
</div></nav>

<script>
"use strict";
// ============================================================ text (EN / SK)
const T = {
  en: {
    quick: "Quick evening", big: "Big shop · 3–4 days", gym: "Coming from the gym", gymHint: "Adds Albert on the way home",
    haveTitle: "Already have at home", haveHint: "Tap what you don't need today.", lowTitle: "Pantry running low",
    lowHint: "Tap staples you need to restock.", tPlan: "Plan", tDeals: "Deals", tPrices: "Prices", tDrug: "Drugstore", tSet: "Settings",
    recommended: "Recommended", goTo: "Go to", total: "You pay", vsSingle: "Saved vs best single shop", vsNormal: "Saved vs usual prices",
    cards: "Take with you", noCards: "No loyalty card needed", how: "How the decision was made", list: "Shopping list",
    options: "All options", option: "Option", basket: "Basket", stockBonus: "Stock-up", score: "Effective", est: "est.",
    estNote: "items estimated (no current price at that shop; usual price used)", notCompared: "Not compared: {s} (no open price data — they block robots).",
    bestSingle: "Best single shop: {s} — {v}.", addWorth: "Adding {s} saves {v} → above your {th} threshold → worth the extra stop.",
    addNot: "Adding {s} saves only {v} → below your {th} threshold → not worth it.", nothing: "Nothing to buy — everything is at home.",
    stockTitle: "Stock up now", stockHint: "≥{a}% below usual price. Suggested amount = weeks of your normal use.", goodTitle: "Good deals this week",
    lunchTitle: "Lunch idea", upcoming: "Starting soon", none: "No offers meeting your thresholds right now.",
    buy: "Buy", save: "save", usual: "usual", freezes: "freezes well", longLife: "long shelf life", validTo: "until", from: "from",
    perPortion: "per portion", portions: "4 big portions (2 lunches for 2)", routeNo: "not on today's route",
    pricesHint: "Best current price per shop, compared per unit. ★ = promotion.", noPrice: "no current price",
    drugHint: "Never pay full price for drugstore items — buy when they are cheap.", drugLow: "Need now",
    settings: "Settings", stopTh: "Extra stop must save at least", tripTh: "Separate trip must save at least", stockPct: "Stock-up when at least % below usual",
    alertPct: "Alert when at least % below usual", data: "Data sources", updatedAt: "Prices updated", reset: "Reset settings",
    covered: "covered", notCovered: "not covered", howWorks: "How it works",
    howText: "A robot on GitHub reads the public offer pages of Lidl, Billa and Albert every morning (plus Wednesday and Thursday evenings), converts every price to a price per kg / litre / piece and learns your usual prices. The app builds your basket from your normal consumption and compares every shop combination on your route.",
    offline: "Offline — showing the last saved prices.", loadErr: "Could not load prices yet. The robot may still be running — try again in a few minutes.",
    whole: "kg", piece: "pc", litre: "l", multi: "multi-buy", normalPrice: "normal price", noData: "no data yet", left: "left over",
    appCard: "app", unitCalc: "{n} × {p}", weighed: "≈ {q} {u} × {p}/{u}", deals: "deals", item: "Item", shopCol: "Shop", unitCol: "Per unit", vsUsual: "vs usual",
    freshDeal: "fresh — buy for this week only", weeks: "{n} weeks", updatedAgo: "updated {t}"
  },
  sk: {
    quick: "Rýchly večerný nákup", big: "Veľký nákup · 3–4 dni", gym: "Idem z posilňovne", gymHint: "Pridá Albert po ceste domov",
    haveTitle: "Doma už mám", haveHint: "Ťukni, čo dnes netreba.", lowTitle: "Dochádzajú zásoby", lowHint: "Ťukni, čo treba doplniť.",
    tPlan: "Plán", tDeals: "Akcie", tPrices: "Ceny", tDrug: "Drogéria", tSet: "Nastavenia",
    recommended: "Odporúčanie", goTo: "Choď do", total: "Zaplatíš", vsSingle: "Ušetrené oproti najlepšiemu 1 obchodu", vsNormal: "Ušetrené oproti bežným cenám",
    cards: "Zober si", noCards: "Netreba vernostnú kartu", how: "Ako vzniklo rozhodnutie", list: "Nákupný zoznam",
    options: "Všetky možnosti", option: "Možnosť", basket: "Košík", stockBonus: "Zásoby", score: "Efektívne", est: "odhad",
    estNote: "položiek odhadnutých (v obchode nie je aktuálna cena; použitá bežná cena)", notCompared: "Neporovnané: {s} (žiadne otvorené dáta — blokujú roboty).",
    bestSingle: "Najlepší jeden obchod: {s} — {v}.", addWorth: "Pridanie {s} ušetrí {v} → nad tvojou hranicou {th} → oplatí sa zastaviť.",
    addNot: "Pridanie {s} ušetrí iba {v} → pod hranicou {th} → neoplatí sa.", nothing: "Netreba nič kupovať — všetko je doma.",
    stockTitle: "Teraz sa oplatí nakúpiť do zásoby", stockHint: "≥{a}% pod bežnou cenou. Množstvo = týždne tvojej bežnej spotreby.", goodTitle: "Dobré akcie tento týždeň",
    lunchTitle: "Nápad na obed", upcoming: "Čoskoro začína", none: "Teraz nie sú akcie nad tvojimi hranicami.",
    buy: "Kúp", save: "ušetríš", usual: "bežne", freezes: "dá sa zamraziť", longLife: "dlhá trvanlivosť", validTo: "do", from: "od",
    perPortion: "na porciu", portions: "4 veľké porcie (2 obedy pre 2)", routeNo: "nie je na dnešnej trase",
    pricesHint: "Najlepšia aktuálna cena v každom obchode, porovnaná na jednotku. ★ = akcia.", noPrice: "bez aktuálnej ceny",
    drugHint: "Drogériu nikdy nekupuj za plnú cenu — kupuj, keď je lacná.", drugLow: "Treba teraz",
    settings: "Nastavenia", stopTh: "Ďalšia zastávka musí ušetriť aspoň", tripTh: "Samostatná cesta musí ušetriť aspoň", stockPct: "Zásoby pri zľave aspoň %",
    alertPct: "Upozornenie pri zľave aspoň %", data: "Zdroje dát", updatedAt: "Ceny aktualizované", reset: "Obnoviť nastavenia",
    covered: "pokryté", notCovered: "nepokryté", howWorks: "Ako to funguje",
    howText: "Robot na GitHube každé ráno (a v stredu a vo štvrtok večer) prečíta verejné akciové stránky Lidla, Billy a Alberta, prepočíta každú cenu na kg / liter / kus a učí sa tvoje bežné ceny. Aplikácia zostaví košík podľa tvojej spotreby a porovná všetky kombinácie obchodov na tvojej trase.",
    offline: "Offline — zobrazujem posledné uložené ceny.", loadErr: "Ceny sa zatiaľ nepodarilo načítať. Robot možno ešte beží — skús o pár minút.",
    whole: "kg", piece: "ks", litre: "l", multi: "pri kúpe viac ks", normalPrice: "bežná cena", noData: "zatiaľ bez dát", left: "zvyšok",
    appCard: "aplikácia", unitCalc: "{n} × {p}", weighed: "≈ {q} {u} × {p}/{u}", deals: "akcie", item: "Položka", shopCol: "Obchod", unitCol: "Za jednotku", vsUsual: "vs bežne",
    freshDeal: "čerstvé — kúp len na tento týždeň", weeks: "{n} týždne", updatedAgo: "aktualizované {t}"
  }
};
const SHOP = { lidl: "Lidl", billa: "Billa", albert: "Albert", kaufland: "Kaufland", tesco: "Tesco", sintra: "Sintra" };
const SHOP_COLOR = { lidl: "#0050aa", billa: "#e2001a", albert: "#0a7c3d", kaufland: "#c8102e", tesco: "#00539f", sintra: "#f39200" };
const DEFAULTS = { stopBrno: 100, tripBrno: 150, stopKk: 4, tripKk: 6, stockPct: 30, alertPct: 40 };
const LS = "saving.v1";

// ============================================================ state
let state = { city: "brno", lang: "en", mode: "big", gym: false, tab: "plan", have: { day: "", ids: [] }, low: [], drugLow: [], set: { ...DEFAULTS } };
try { const s = JSON.parse(localStorage.getItem(LS) || "{}"); state = { ...state, ...s, set: { ...DEFAULTS, ...(s.set || {}) } }; } catch (e) {}
const today = new Date().toISOString().slice(0, 10);
if (!state.have || state.have.day !== today) state.have = { day: today, ids: [] };
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

let ITEMS = [], BYID = {}, PRICES = null, OFFLINE = false;
const $ = (id) => document.getElementById(id);
const L = () => T[state.lang] || T.en;
function t(k, v) { let s = L()[k] ?? T.en[k] ?? k; if (v) for (const [a, b] of Object.entries(v)) s = s.replaceAll("{" + a + "}", b); return s; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function cur() { return PRICES?.cities?.[state.city]?.currency || (state.city === "brno" ? "CZK" : "EUR"); }
function money(v, c = cur()) {
  if (v == null || !isFinite(v)) return "—";
  const s = v.toLocaleString(c === "EUR" ? "sk-SK" : "cs-CZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return c === "EUR" ? s + " €" : s + " Kč";
}
function uName(u) { return u === "kg" ? t("whole") : u === "l" ? t("litre") : t("piece"); }
function iname(it) { return state.lang === "sk" ? it.sk : it.en; }
function qtyTxt(q, u) {
  if (u === "kg") return q < 1 ? Math.round(q * 1000) + " g" : (+q.toFixed(2)).toLocaleString() + " kg";
  if (u === "l") return q < 1 ? Math.round(q * 1000) + " ml" : (+q.toFixed(2)).toLocaleString() + " l";
  return (+q.toFixed(1)).toLocaleString() + " " + t("piece");
}
function dateTxt(iso) { if (!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return d.toLocaleDateString(state.lang === "sk" ? "sk-SK" : "en-GB", { day: "numeric", month: "numeric" }); }
function thresholds() { return state.city === "brno" ? { stop: +state.set.stopBrno, trip: +state.set.tripBrno } : { stop: +state.set.stopKk, trip: +state.set.tripKk }; }

// ============================================================ price logic
const NOW = Date.now();
function validNow(o) {
  const f = o.valid_from ? Date.parse(o.valid_from) : null;
  const toRaw = o.valid_to; const to = toRaw ? Date.parse(toRaw.length === 10 ? toRaw + "T23:59:59" : toRaw) : null;
  if (f && f > NOW + 3600e3) return false;
  if (to && to < NOW) return false;
  return true;
}
function upcoming(o) { const f = o.valid_from ? Date.parse(o.valid_from) : null; return f && f > NOW + 3600e3 && f - NOW < 5 * 864e5; }
function cityData() { return PRICES?.cities?.[state.city]; }
function offersFor(id, shop) { const d = cityData()?.items?.[id]; return (d?.offers || []).filter((o) => (!shop || o.shop === shop) && validNow(o)); }
function usual(id) { return cityData()?.items?.[id]?.usual ?? null; }
function refUnit(o) { return usual(o.item) || o.normal_unit; }
function discount(o) { const r = refUnit(o); return r && r > o.unit_price ? 1 - o.unit_price / r : 0; }

function purchase(o, need) {
  if (o.weighted || !o.pack) return { o, packs: null, qty: need, cost: o.unit_price * need, paid: o.unit_price, note: "w" };
  let packs = Math.max(1, Math.ceil(need / o.pack - 1e-6)), price = o.price, note = "";
  if (o.min_qty > 1 && packs < o.min_qty) {
    const A = o.min_qty * o.price, B = o.normal_price ? packs * o.normal_price : Infinity;
    if (A <= B) { packs = o.min_qty; note = "multi"; } else { price = o.normal_price; note = "normal"; }
  }
  return { o, packs, qty: packs * o.pack, cost: packs * price, paid: price, note };
}
function bestPurchase(id, shop, need) {
  let best = null;
  for (const o of offersFor(id, shop)) { const p = purchase(o, need); if (!best || p.cost < best.cost - 1e-9 || (Math.abs(p.cost - best.cost) < 1e-9 && o.unit_price < best.o.unit_price)) best = p; }
  return best;
}

function basket() {
  const days = state.mode === "quick" ? 1 : 3.5;
  const out = [];
  for (const it of ITEMS) {
    if (it.group === "drugstore") continue;
    const low = state.low.includes(it.id);
    if (it.group === "pantry" || it.weekly === 0) {
      if (!low) continue;
      const need = it.weekly > 0 ? it.weekly * 2 : (it.unit === "ks" ? 1 : 0.5);
      out.push({ it, need });
      continue;
    }
    if (state.mode === "quick" && !it.quick) continue;
    if (state.have.ids.includes(it.id)) continue;
    out.push({ it, need: it.weekly * days / 7 });
  }
  return out;
}

function stockDeals() {
  const res = [];
  const a = +state.set.stockPct / 100;
  for (const it of ITEMS) {
    if (it.group === "drugstore") continue;
    const offs = offersFor(it.id).filter((o) => o.conf !== "low" && o.promo);
    let best = null;
    for (const o of offs) { const d = discount(o); if (d >= a && (!best || o.unit_price < best.o.unit_price)) best = { o, d }; }
    if (!best) continue;
    const stockable = it.shelf !== "fresh";
    const weeks = it.shelf === "freezable" ? 4 : 8;
    let qty = stockable ? (it.weekly > 0 ? it.weekly * weeks : (best.o.pack || 1) * 2) : (it.weekly || (best.o.pack || 1));
    let packs = best.o.pack && !best.o.weighted ? Math.max(best.o.min_qty || 1, Math.ceil(qty / best.o.pack - 1e-6)) : null;
    if (packs) qty = packs * best.o.pack;
    const ref = refUnit(best.o);
    res.push({ it, o: best.o, d: best.d, stockable, weeks, qty, packs, cost: packs ? packs * best.o.price : qty * best.o.unit_price, saving: (ref - best.o.unit_price) * qty, ref });
  }
  return res.sort((x, y) => y.saving - x.saving);
}

function evaluate(shops, bask, deals) {
  const lines = []; let total = 0, est = 0, normal = 0;
  for (const b of bask) {
    let best = null;
    for (const s of shops) { const p = bestPurchase(b.it.id, s, b.need); if (p && (!best || p.cost < best.cost)) best = { ...p, shop: s }; }
    if (!best) {
      const u = usual(b.it.id) ?? Math.min(...offersFor(b.it.id).map((o) => o.unit_price), Infinity);
      if (isFinite(u)) { best = { shop: shops[0], est: true, cost: u * b.need, qty: b.need, packs: null, paid: u }; est++; }
      else { lines.push({ b, missing: true }); continue; }
    }
    lines.push({ b, ...best }); total += best.cost;
    const u = usual(b.it.id); normal += (u && best.o ? Math.max(u, best.o.unit_price) * best.qty : best.cost);
  }
  // stock-up savings available on this route (counted toward thresholds)
  let bonus = 0;
  for (const d of deals) if (d.stockable && shops.includes(d.o.shop)) {
    const inBasket = bask.find((b) => b.it.id === d.it.id);
    const extra = Math.max(0, d.qty - (inBasket ? inBasket.need : 0));
    bonus += (d.ref - d.o.unit_price) * extra;
  }
  return { shops, lines, total, est, normal, bonus, score: total - bonus };
}

function combos() {
  const cd = cityData(); if (!cd) return [];
  const cov = cd.covered;
  if (state.city === "brno") {
    const home = [["lidl"], ["billa"], ["lidl", "billa"]];
    const gym = [["albert"], ["albert", "lidl"], ["albert", "billa"], ["albert", "lidl", "billa"]];
    return (state.gym ? home.concat(gym) : home).filter((c) => c.every((s) => cov.includes(s)));
  }
  const out = cov.map((s) => [s]);
  if (cov.length > 1) out.push(cov.slice());
  return out;
}

function decide() {
  const bask = basket();
  const deals = stockDeals();
  const opts = combos().map((c) => evaluate(c, bask, deals));
  if (!opts.length) return { bask, deals, opts, rec: null, steps: [] };
  const th = thresholds();
  const singles = opts.filter((o) => o.shops.length === 1).sort((a, b) => a.score - b.score);
  let rec = singles[0];
  const steps = [{ type: "single", o: rec }];
  for (;;) {
    const next = opts.filter((o) => o.shops.length === rec.shops.length + 1 && rec.shops.every((s) => o.shops.includes(s))).sort((a, b) => a.score - b.score)[0];
    if (!next) break;
    const added = next.shops.find((s) => !rec.shops.includes(s));
    const gain = rec.score - next.score;
    steps.push({ type: gain >= th.stop ? "worth" : "not", added, gain });
    if (gain >= th.stop) rec = next; else break;
  }
  return { bask, deals, opts, rec, steps, bestSingle: singles[0] };
}

function lunchIdea() {
  const proteins = ["chicken", "pork", "liver_chicken", "liver_pork", "beef", "chicken_frozen"];
  const bestOf = (id) => { const offs = offersFor(id).filter((o) => o.conf !== "low"); return offs.sort((a, b) => a.unit_price - b.unit_price)[0] || null; };
  const unitOf = (id, fallbackCzk) => { const o = bestOf(id); return o ? o.unit_price : (usual(id) ?? (cur() === "EUR" ? fallbackCzk / PRICES.eur_czk : fallbackCzk)); };
  const rice = unitOf("rice", 40), pasta = unitOf("pasta", 45), can = unitOf("tomato_can", 60);
  const vegs = ["broccoli", "frozen_veg", "carrot", "paprika"].map((id) => ({ id, o: bestOf(id) })).filter((v) => v.o).sort((a, b) => a.o.unit_price - b.o.unit_price);
  const veg = vegs[0];
  let best = null;
  for (const id of proteins) {
    const o = bestOf(id); if (!o) continue;
    const d = discount(o); if (d < 0.2) continue;
    const carbRice = 0.4 * rice, carbPasta = 0.4 * pasta + 0.8 * can;
    const useRice = carbRice <= carbPasta;
    const total = 0.75 * o.unit_price + (useRice ? carbRice : carbPasta) + (veg ? 0.4 * veg.o.unit_price : 0);
    const per = total / 4;
    if (!best || per < best.per) best = { o, d, useRice, veg, total, per, id };
  }
  return best;
}

// ============================================================ rendering
function badgeFor(o) {
  let s = "";
  const d = discount(o);
  if (o.promo && d >= 0.05) s += `<span class="badge ${d >= state.set.alertPct / 100 ? "b-bad" : d >= state.set.stockPct / 100 ? "b-warn" : "b-good"}">−${Math.round(d * 100)}%</span>`;
  else if (o.promo) s += `<span class="badge b-good">★</span>`;
  if (o.card) s += `<span class="badge b-info">${esc(o.card)}</span>`;
  if (o.min_qty > 1) s += `<span class="badge b-accent">${t("multi")} ${o.min_qty}+</span>`;
  if (o.conf === "low") s += `<span class="badge">?</span>`;
  return s;
}
function lineCalc(l) {
  const u = l.b.it.unit;
  if (l.est) return `${t("est")} · ${qtyTxt(l.qty, u)} × ${money(l.paid)}/${uName(u)}`;
  if (l.packs == null) return t("weighed", { q: (+l.qty.toFixed(2)).toLocaleString(), u: uName(u), p: money(l.o.unit_price) });
  return `${l.packs} × ${money(l.paid)} · ${money(l.o.unit_price)}/${uName(u)}`;
}

function renderPlan() {
  const out = $("planOut");
  $("gymRow").style.display = state.city === "brno" ? "" : "none";
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const r = decide();
  // chips
  const days = state.mode === "quick" ? 1 : 3.5;
  const candidates = ITEMS.filter((it) => it.group !== "drugstore" && it.group !== "pantry" && it.weekly > 0 && (state.mode === "big" || it.quick));
  $("haveChips").innerHTML = candidates.map((it) => `<button class="chip ${state.have.ids.includes(it.id) ? "off" : ""}" data-have="${it.id}">${esc(iname(it))}</button>`).join("");
  const pantry = ITEMS.filter((it) => it.group === "pantry");
  $("lowChips").innerHTML = pantry.map((it) => `<button class="chip ${state.low.includes(it.id) ? "on" : ""}" data-low="${it.id}">${esc(iname(it))}</button>`).join("");
  if (!r.bask.length) { out.innerHTML = `<div class="card empty">${t("nothing")}</div>`; return; }
  if (!r.rec) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const rec = r.rec, th = thresholds();
  const cards = new Set();
  rec.lines.forEach((l) => { if (l.o && l.o.card) cards.add(l.o.card); });
  const recDeals = r.deals.filter((d) => d.stockable && rec.shops.includes(d.o.shop));
  recDeals.forEach((d) => { if (d.o.card) cards.add(d.o.card); });
  const savedSingle = rec.shops.length > 1 ? r.bestSingle.score - rec.score : 0;
  const savedNormal = Math.max(0, rec.normal - rec.total);
  let html = `<div class="card hero">
    <div class="label">${t("recommended")}</div>
    <div class="go">${t("goTo")} ${rec.shops.map((s) => SHOP[s]).join(" → ")}</div>
    <div class="nums">
      <div><b>${money(rec.total)}</b><span>${t("total")}</span></div>
      <div><b>${money(savedNormal)}</b><span>${t("vsNormal")}</span></div>
    </div>
    ${rec.shops.length > 1 ? `<div class="cards">${t("vsSingle")}: ${money(savedSingle)}</div>` : ""}
    <div class="cards">${cards.size ? t("cards") + ": " + [...cards].map(esc).join(", ") : t("noCards")}</div>
  </div>`;
  // how
  const cd = cityData();
  const why = [];
  why.push(t("bestSingle", { s: SHOP[r.bestSingle.shops[0]], v: money(r.bestSingle.total) + (r.bestSingle.est ? ` (${r.bestSingle.est} ${t("est")})` : "") }));
  r.steps.slice(1).forEach((s) => why.push(t(s.type === "worth" ? "addWorth" : "addNot", { s: SHOP[s.added], v: money(s.gain), th: money(th.stop) })));
  if (cd.uncovered?.length) why.push(t("notCompared", { s: cd.uncovered.map((s) => SHOP[s]).join(", ") }));
  if (rec.est) why.push(`${rec.est} ${t("estNote")}`);
  html += `<div class="card"><h2>${t("how")}</h2><ul class="why">${why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
  // shopping list by shop
  html += `<div class="card"><h2>${t("list")}</h2>`;
  for (const s of rec.shops) {
    const ls = rec.lines.filter((l) => l.shop === s && !l.missing);
    if (!ls.length) continue;
    const sub = ls.reduce((a, l) => a + l.cost, 0);
    html += `<div class="shop"><span class="dot" style="background:${SHOP_COLOR[s]}"></span>${SHOP[s]}<span class="muted small" style="margin-left:auto">${money(sub)}</span></div>`;
    for (const l of ls) {
      html += `<div class="line"><div><div class="what">${esc(iname(l.b.it))} ${l.o ? badgeFor(l.o) : `<span class="badge b-warn">${t("est")}</span>`}</div>
        <div class="prod">${l.o ? esc(l.o.name) + (l.o.valid_to ? ` · ${t("validTo")} ${dateTxt(l.o.valid_to)}` : "") : t("noPrice")}</div></div>
        <div><div class="cost">${money(l.cost)}</div><div class="calc">${lineCalc(l)}</div></div></div>`;
    }
  }
  const missing = rec.lines.filter((l) => l.missing);
  if (missing.length) html += `<div class="note">${t("noPrice")}: ${missing.map((l) => esc(iname(l.b.it))).join(", ")}</div>`;
  html += `</div>`;
  // stock-up on route
  if (recDeals.length) {
    html += `<div class="card"><h2>${t("stockTitle")}</h2>${recDeals.slice(0, 6).map(dealHtml).join("")}</div>`;
  }
  const idea = lunchIdea();
  if (idea) html += ideaHtml(idea);
  // options table
  const sorted = r.opts.slice().sort((a, b) => a.score - b.score);
  html += `<div class="card"><h2>${t("options")}</h2><div class="tw"><table><thead><tr><th>${t("option")}</th><th class="num">${t("basket")}</th><th class="num">${t("stockBonus")}</th><th class="num">${t("score")}</th></tr></thead><tbody>
    ${sorted.map((o) => `<tr class="${o === rec ? "best" : ""}"><td>${o.shops.map((s) => SHOP[s]).join(" + ")}${o.est ? ` <span class="badge b-warn">${o.est} ${t("est")}</span>` : ""}</td><td class="num">${money(o.total)}</td><td class="num">${o.bonus > 0.5 ? "−" + money(o.bonus) : "—"}</td><td class="num">${money(o.score)}</td></tr>`).join("")}
    </tbody></table></div><div class="note">${t("score")} = ${t("basket")} − ${t("stockBonus").toLowerCase()} (${t("stockHint", { a: state.set.stockPct })})</div></div>`;
  out.innerHTML = html;
}

function dealHtml(d) {
  const u = d.it.unit;
  const amount = d.packs ? `${d.packs} × ${d.o.pack ? qtyTxt(d.o.pack, u) : ""}` : qtyTxt(d.qty, u);
  const why = d.stockable ? (d.it.shelf === "freezable" ? t("freezes") : t("longLife")) + " · " + t("weeks", { n: d.weeks }) : t("freshDeal");
  return `<div class="deal"><div class="row"><div class="t">${esc(iname(d.it))} — ${SHOP[d.o.shop]}</div>${badgeFor(d.o)}</div>
    <div class="m">${esc(d.o.name)} · ${money(d.o.price)}${d.o.pack && !d.o.weighted ? " / " + qtyTxt(d.o.pack, u) : "/" + uName(u)} = ${money(d.o.unit_price)}/${uName(u)} · ${t("usual")} ${money(d.ref)}/${uName(u)}${d.o.valid_to ? " · " + t("validTo") + " " + dateTxt(d.o.valid_to) : ""}</div>
    <div class="s">${t("buy")} <b>${amount}</b> = ${money(d.cost)} → ${t("save")} <b>${money(d.saving)}</b> <span class="muted small">(${why})</span></div></div>`;
}
function ideaHtml(i) {
  const pName = iname(BYID[i.id]);
  const parts = [`${pName} ${money(i.o.unit_price)}/kg (${SHOP[i.o.shop]}, −${Math.round(i.d * 100)}%)`, i.useRice ? iname(BYID.rice) : iname(BYID.pasta) + " + " + iname(BYID.tomato_can).toLowerCase()];
  if (i.veg) parts.push(`${iname(BYID[i.veg.id])} (${SHOP[i.veg.o.shop]})`);
  return `<div class="card idea"><h2>${t("lunchTitle")}</h2><div><b>${parts.map(esc).join(" + ")}</b></div>
    <div class="small" style="margin-top:6px">${t("portions")}: ≈ ${money(i.total)} → <b>${money(i.per)} ${t("perPortion")}</b></div></div>`;
}

function renderDeals() {
  const out = $("dealsOut");
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const deals = stockDeals();
  const route = state.city === "brno" ? (state.gym ? ["lidl", "billa", "albert"] : ["lidl", "billa"]) : cityData().covered;
  const stock = deals.filter((d) => d.stockable);
  const fresh = deals.filter((d) => !d.stockable);
  let html = `<div class="card"><h2>${t("stockTitle")}</h2><div class="note" style="margin:0 0 6px">${t("stockHint", { a: state.set.stockPct })}</div>
    ${stock.length ? stock.map((d) => dealHtml(d) + (route.includes(d.o.shop) ? "" : `<div class="tiny muted" style="margin-top:-6px">${t("routeNo")}</div>`)).join("") : `<div class="empty">${t("none")}</div>`}</div>`;
  if (fresh.length) html += `<div class="card"><h2>${t("goodTitle")}</h2>${fresh.map(dealHtml).join("")}</div>`;
  const idea = lunchIdea();
  if (idea) html += ideaHtml(idea);
  // upcoming
  const up = [];
  for (const it of ITEMS) for (const o of (cityData().items[it.id]?.offers || [])) if (upcoming(o) && discount(o) >= 0.2) up.push({ it, o });
  if (up.length) html += `<div class="card"><h2>${t("upcoming")}</h2>${up.slice(0, 12).map(({ it, o }) => `<div class="deal"><div class="row"><div class="t">${esc(iname(it))} — ${SHOP[o.shop]}</div>${badgeFor(o)}</div><div class="m">${esc(o.name)} · ${money(o.price)} · ${money(o.unit_price)}/${uName(it.unit)} · ${t("from")} ${dateTxt(o.valid_from)}</div></div>`).join("")}</div>`;
  out.innerHTML = html;
}

function renderPrices() {
  const out = $("pricesOut");
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const q = ($("q").value || "").toLowerCase();
  const cd = cityData();
  const shops = cd.covered;
  let html = `<div class="card"><div class="note" style="margin:0">${t("pricesHint")}</div></div>`;
  for (const g of ["dinner", "lunch", "breakfast", "fruit", "pantry", "drugstore"]) {
    const its = ITEMS.filter((it) => it.group === g && (!q || iname(it).toLowerCase().includes(q) || it.en.toLowerCase().includes(q)));
    if (!its.length) continue;
    html += `<div class="card"><div class="tw"><table><thead><tr><th>${t("item")}</th>${shops.map((s) => `<th class="num">${SHOP[s]}</th>`).join("")}<th class="num">${t("usual")}</th></tr></thead><tbody>`;
    for (const it of its) {
      const cells = shops.map((s) => offersFor(it.id, s).sort((a, b) => a.unit_price - b.unit_price)[0] || null);
      const min = Math.min(...cells.filter(Boolean).map((o) => o.unit_price));
      html += `<tr><td><b>${esc(iname(it))}</b><div class="tiny muted">/${uName(it.unit)}</div></td>${cells.map((o) => o ? `<td class="num" title="${esc(o.name)}" style="${o.unit_price === min ? "font-weight:700;color:var(--good)" : ""}">${money(o.unit_price)}${o.promo ? "★" : ""}<div class="tiny muted">${esc(o.name.slice(0, 22))}</div></td>` : `<td class="num muted">—</td>`).join("")}<td class="num muted">${money(usual(it.id))}</td></tr>`;
    }
    html += `</tbody></table></div></div>`;
  }
  out.innerHTML = html;
}

function renderDrug() {
  const out = $("drugOut");
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const its = ITEMS.filter((it) => it.group === "drugstore");
  let html = `<div class="card"><div class="note" style="margin:0 0 6px">${t("drugHint")}</div><div class="small"><b>${t("drugLow")}:</b></div>
    <div class="chips">${its.map((it) => `<button class="chip ${state.drugLow.includes(it.id) ? "on" : ""}" data-dlow="${it.id}">${esc(iname(it))}</button>`).join("")}</div></div>`;
  for (const it of its) {
    const offs = offersFor(it.id).sort((a, b) => a.unit_price - b.unit_price);
    const need = state.drugLow.includes(it.id);
    html += `<div class="card"><div class="row"><h2 style="margin:0">${esc(iname(it))}</h2>${need ? `<span class="badge b-accent">${t("drugLow")}</span>` : ""}</div>`;
    if (!offs.length) { html += `<div class="empty">${t("noData")}</div></div>`; continue; }
    html += offs.slice(0, 4).map((o, i) => `<div class="deal"><div class="row"><div class="t">${i === 0 ? "★ " : ""}${SHOP[o.shop]} · ${money(o.unit_price)}/${it.unit === "l" ? "l" : uName(it.unit)}</div>${badgeFor(o)}</div>
      <div class="m">${esc(o.name)} · ${money(o.price)}${o.valid_to ? " · " + t("validTo") + " " + dateTxt(o.valid_to) : ""}</div></div>`).join("");
    const u = usual(it.id);
    if (u) html += `<div class="note">${t("usual")}: ${money(u)}/${uName(it.unit)}</div>`;
    html += `</div>`;
  }
  out.innerHTML = html;
}

function renderSettings() {
  const s = state.set, c = state.city === "brno" ? "Kč" : "€";
  const src = PRICES?.sources || {};
  const rows = Object.entries(src).filter(([k]) => k.endsWith(state.city === "brno" ? "_brno" : "_kezmarok")).map(([k, v]) => {
    const shop = k.split("_")[0];
    const ok = v.status === "ok";
    return `<div class="setrow"><div><b>${SHOP[shop] || shop}</b><div class="tiny muted">${esc(v.note || "")}</div></div><span class="badge ${ok ? "b-good" : "b-warn"}">${ok ? t("covered") + " · " + v.offers : t("notCovered")}</span></div>`;
  }).join("");
  $("setOut").innerHTML = `<div class="card"><h2>${t("settings")}</h2>
    <div class="setrow"><span>${t("stopTh")} (Brno)</span><input type="number" data-set="stopBrno" value="${s.stopBrno}"></div>
    <div class="setrow"><span>${t("tripTh")} (Brno)</span><input type="number" data-set="tripBrno" value="${s.tripBrno}"></div>
    <div class="setrow"><span>${t("stopTh")} (Kežmarok, €)</span><input type="number" data-set="stopKk" value="${s.stopKk}"></div>
    <div class="setrow"><span>${t("tripTh")} (Kežmarok, €)</span><input type="number" data-set="tripKk" value="${s.tripKk}"></div>
    <div class="setrow"><span>${t("stockPct")}</span><input type="number" data-set="stockPct" value="${s.stockPct}"></div>
    <div class="setrow"><span>${t("alertPct")}</span><input type="number" data-set="alertPct" value="${s.alertPct}"></div>
    <div style="margin-top:10px"><button class="chip" id="resetSet">${t("reset")}</button></div></div>
    <div class="card"><h2>${t("data")}</h2><div class="small muted">${t("updatedAt")}: ${PRICES ? new Date(PRICES.generated).toLocaleString(state.lang === "sk" ? "sk-SK" : "en-GB") : "—"}</div>${rows}</div>
    <div class="card"><h2>${t("howWorks")}</h2><div class="small">${t("howText")}</div></div>`;
  $("setOut").querySelectorAll("input[data-set]").forEach((el) => el.addEventListener("change", () => { state.set[el.dataset.set] = +el.value; save(); renderAll(); }));
  $("resetSet").onclick = () => { state.set = { ...DEFAULTS }; save(); renderAll(); };
}

function renderChrome() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  for (const [id, key] of [["lang", "lang"], ["city", "city"], ["mode", "mode"]]) $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === state[key]));
  $("gym").checked = !!state.gym;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.p === state.tab));
  document.querySelectorAll(".page").forEach((p) => p.classList.toggle("on", p.id === "p-" + state.tab));
  $("q").placeholder = state.lang === "sk" ? "Hľadať" : "Search";
  if (PRICES) {
    const mins = Math.round((NOW - Date.parse(PRICES.generated)) / 60000);
    const ago = mins < 60 ? mins + " min" : mins < 1440 ? Math.round(mins / 60) + " h" : Math.round(mins / 1440) + " d";
    $("updated").textContent = (OFFLINE ? "⚠ " : "") + t("updatedAgo", { t: ago });
  }
}
function renderAll() { renderChrome(); renderPlan(); renderDeals(); renderPrices(); renderDrug(); renderSettings(); }

// ============================================================ events
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const seg = b.closest(".seg");
  if (seg && b.dataset.v) { const key = seg.id; state[key] = b.dataset.v; save(); renderAll(); return; }
  if (b.dataset.p) { state.tab = b.dataset.p; save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.have) { const id = b.dataset.have, a = state.have.ids; state.have.ids = a.includes(id) ? a.filter((x) => x !== id) : a.concat(id); save(); renderPlan(); return; }
  if (b.dataset.low) { const id = b.dataset.low; state.low = state.low.includes(id) ? state.low.filter((x) => x !== id) : state.low.concat(id); save(); renderPlan(); return; }
  if (b.dataset.dlow) { const id = b.dataset.dlow; state.drugLow = state.drugLow.includes(id) ? state.drugLow.filter((x) => x !== id) : state.drugLow.concat(id); save(); renderDrug(); return; }
});
$("gym").addEventListener("change", (e) => { state.gym = e.target.checked; save(); renderPlan(); renderDeals(); });
$("q").addEventListener("input", renderPrices);
// keep details open state between renders
for (const id of ["haveBox", "lowBox"]) $(id).addEventListener("toggle", () => {});

// ============================================================ load
async function load() {
  renderChrome();
  try {
    const [ci, pr] = await Promise.all([fetch("config/items.json", { cache: "no-cache" }), fetch("data/prices.json", { cache: "no-cache" })]);
    if (!ci.ok || !pr.ok) throw new Error("http");
    const cfg = await ci.json();
    ITEMS = cfg.items; BYID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
    PRICES = await pr.json();
    OFFLINE = !navigator.onLine;
  } catch (e) {
    PRICES = null;
  }
  renderAll();
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
load();
</script>
</body>
</html>

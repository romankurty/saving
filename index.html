<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grocery</title>
<meta name="description" content="Where to shop today, what to buy, what is cheap.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grocery">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f3f5f4; --card: #ffffff; --text: #13201c; --muted: #5d6c67; --line: #e3e8e6; --soft: #eef2f0;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dff1ee;
    --good: #166534; --good-soft: #dcf2e3; --warn: #92400e; --warn-soft: #fbefdc; --bad: #9f1239; --bad-soft: #fbe4ea;
    --info: #1e4e8c; --info-soft: #e2ecf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1311; --card: #141e1b; --text: #e5eeea; --muted: #94a49f; --line: #23302c; --soft: #1a2622;
      --accent: #2dd4bf; --accent-ink: #062a26; --accent-soft: #123430;
      --good: #86efac; --good-soft: #13301f; --warn: #fcd34d; --warn-soft: #33270e; --bad: #fda4af; --bad-soft: #3a1720;
      --info: #9cc3f5; --info-soft: #172a42;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; flex: none; }
  .brand h1 { font-size: 1.2rem; margin: 0; }
  .brand small { display: block; color: var(--muted); font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-size: 0.88rem; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg.full { display: flex; width: 100%; }
  .seg.full button { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 1.02rem; margin: 0 0 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.86rem; }
  .tiny { font-size: 0.76rem; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
  .switch { position: relative; width: 48px; height: 29px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; width: 23px; height: 23px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(19px); }
  details > summary { cursor: pointer; list-style: none; font-weight: 600; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; color: var(--muted); }
  details[open] > summary::before { content: "▾ "; }
  details.card > summary { font-size: 1rem; }
  details.card[open] > summary { margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--soft); font-size: 0.84rem; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  /* hero */
  .hero { border: 0; background: linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%); color: var(--accent-ink); padding: 16px; }
  .hero .label { font-size: 0.76rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .hero .go { font-size: 1.7rem; font-weight: 800; margin: 2px 0 10px; letter-spacing: -0.01em; line-height: 1.15; }
  .hero .big { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .hero .big b { font-size: 1.45rem; }
  .hero .big span { font-size: 0.84rem; opacity: .9; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { background: rgba(255,255,255,.18); border-radius: 999px; padding: 5px 10px; font-size: 0.82rem; font-weight: 700; }
  /* badges */
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
  .b-good { background: var(--good-soft); color: var(--good); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-info { background: var(--info-soft); color: var(--info); }
  .b-accent { background: var(--accent-soft); color: var(--accent); }
  /* shopping list */
  .shop { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.05rem; margin: 10px 0 2px; }
  .shop:first-child { margin-top: 0; }
  .shop .sum { margin-left: auto; font-size: 0.95rem; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .li { display: grid; grid-template-columns: 30px 1fr auto; gap: 0 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .li.done .nm, .li.done .sub, .li.done .pr { text-decoration: line-through; opacity: .45; }
  .ck { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; margin-top: 1px; }
  .li.done .ck { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .li > div[data-open] { min-width: 0; }
  .nm { font-weight: 650; cursor: pointer; }
  .sub { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .pr { text-align: right; font-weight: 700; white-space: nowrap; }
  .qty { font-weight: 600; color: var(--muted); font-size: 0.86rem; margin-left: 4px; }
  .more { grid-column: 2 / 4; margin-top: 8px; background: var(--soft); border-radius: 12px; padding: 10px; font-size: 0.84rem; }
  .more .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 10px; font-size: 0.84rem; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ghost { background: transparent; }
  .addrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .addrow:first-of-type { border-top: 0; }
  .addrow .t { font-weight: 650; }
  .addrow .m { font-size: 0.8rem; color: var(--muted); }
  .meal { padding: 10px 0; border-top: 1px solid var(--line); }
  .meal:first-of-type { border-top: 0; }
  .meal .t { font-weight: 700; }
  .meal .per { font-weight: 800; color: var(--warn); white-space: nowrap; }
  .calc { margin-top: 6px; font-size: 0.82rem; }
  .calc .row { padding: 2px 0; }
  .idea { background: var(--warn-soft); border-color: transparent; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 4px 0; }
  .note { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  th, td { text-align: left; padding: 7px 5px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem; border-top: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.best td { font-weight: 700; }
  .why { margin: 0; padding-left: 18px; }
  .why li { margin: 4px 0; font-size: 0.88rem; }
  .deal { padding: 10px 0; border-top: 1px solid var(--line); }
  .deal:first-of-type { border-top: 0; }
  .deal .t { font-weight: 700; }
  .deal .m { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  input[type=search], input[type=number] { font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  input[type=search] { width: 100%; }
  input[type=number] { width: 92px; text-align: right; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .setrow:first-of-type { border-top: 0; }
  nav.tabs { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
  nav.tabs button { border: 0; background: transparent; color: var(--muted); font-size: 0.7rem; font-weight: 600; padding: 4px 2px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  .page { display: none; }
  .page.on { display: block; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="icon-192.png" alt="">
      <div style="min-width:0"><h1>Grocery</h1><small id="updated">…</small></div>
    </div>
    <div class="seg" id="lang"><button data-v="en">EN</button><button data-v="sk">SK</button></div>
  </header>

  <div class="seg full" id="city" style="margin-bottom:10px"><button data-v="brno">Brno</button><button data-v="kezmarok">Kežmarok</button></div>

  <section class="page" id="p-plan">
    <div class="card">
      <div class="seg full" id="mode"><button data-v="quick" data-t="quick"></button><button data-v="big" data-t="big"></button><button data-v="lunch" data-t="lunchMode"></button></div>
      <div class="toggle" id="gymRow"><b data-t="gym"></b><label class="switch"><input type="checkbox" id="gym"><span></span></label></div>
    </div>
    <div id="planOut"><div class="loading">…</div></div>
  </section>
  <section class="page" id="p-deals"><div id="dealsOut"></div></section>
  <section class="page" id="p-prices"><div class="card"><input type="search" id="q"></div><div id="pricesOut"></div></section>
  <section class="page" id="p-drug"><div id="drugOut"></div></section>
  <section class="page" id="p-set"><div id="setOut"></div></section>
</div>

<nav class="tabs"><div class="in">
  <button data-p="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span data-t="tPlan"></span></button>
  <button data-p="deals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span data-t="tDeals"></span></button>
  <button data-p="prices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span data-t="tPrices"></span></button>
  <button data-p="drug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4l2 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/><path d="M9 13h6"/></svg><span data-t="tDrug"></span></button>
  <button data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="tSet"></span></button>
</div></nav>

<script>
"use strict";
// ============================================================ texts
const T = {
  en: {
    quick: "Quick", big: "Big shop", lunchMode: "Lunch only", gym: "Coming from the gym (via Albert)",
    tPlan: "Plan", tDeals: "Deals", tPrices: "Prices", tDrug: "Drugstore", tSet: "Settings",
    goTo: "Go to", pay: "you pay", save: "save", vsUsual: "vs usual prices", noCard: "no card needed",
    list: "Shopping list", addItem: "+ Add item", pickItem: "Tap to add", worth: "Worth adding on your route", add: "+ Add", added: "✓ Added",
    meals: "5 cheapest healthy lunches", perPortion: "/ portion", addMeal: "+ Add to list", calc: "Ingredients & prices", goMeal: "Shop just for this", pickMeals: "Which lunch? (tap to choose)", forPortions: "for 4 portions", ingr: "ingredients",
    portions: "4 big portions (2 lunches for 2)", why: "Why this plan", options: "All options",
    option: "Option", basket: "Basket", stockup: "Stock-up", effective: "Effective",
    bestSingle: "Best single shop: {s} — {v}.", addWorth: "Adding {s} saves {v} (≥ {th}) → go.", addNot: "Adding {s} saves only {v} (< {th}) → skip.",
    notCompared: "Not compared: {s} (no open price data).", estNote: "{n} items with estimated price (no current price there).",
    nothing: "Nothing to buy.", estLike: "no current price here — estimated like Billa +5 %", noPrice: "no price", est: "estimate", unitPrice: "Unit price", usual: "usual", valid: "valid", priceOn: "price on",
    check: "check offer ↗", less: "−", moreQ: "+", skip: "Not today", wrong: "Wrong product", restore: "Show hidden products again",
    hiddenN: "{n} hidden products", deal: "deal", healthy: "healthy deal", stockTag: "stock up",
    stockTitle: "Stock up now", freshTitle: "Fresh deals this week", soon: "Starting soon", from: "from",
    none: "No big deals right now.", buy: "buy", weeks: "4 weeks",
    pricesHint: "Cheapest price per unit in each shop. ★ promotion.", search: "Search",
    drugHint: "Buy drugstore items only when cheap.", needNow: "Need now",
    settings: "Settings", stopTh: "Extra stop must save", tripTh: "Separate trip must save", stockPct: "Stock up from % off", alertPct: "Healthy extras / alert from % off",
    weekly: "My weekly amounts", reset: "Reset", data: "Data", checkedAt: "Prices checked {d}", howWorks: "How it works",
    howText: "A robot reads public prices of Lidl, Billa, Albert and Teta every morning (+ Wed/Thu evening). The app always takes the cheapest brand per kg / l / piece and compares shop combinations on your route.",
    covered: "covered", notCovered: "not covered", loadErr: "Prices not loaded yet — try again in a minute.", perWeek: "/ week",
    leftover: "kept", allDone: "All done 🎉"
  },
  sk: {
    quick: "Rýchly", big: "Veľký nákup", lunchMode: "Len obed", gym: "Idem z posilňovne (cez Albert)",
    tPlan: "Plán", tDeals: "Akcie", tPrices: "Ceny", tDrug: "Drogéria", tSet: "Nastavenia",
    goTo: "Choď do", pay: "zaplatíš", save: "ušetríš", vsUsual: "oproti bežným cenám", noCard: "karta netreba",
    list: "Nákupný zoznam", addItem: "+ Pridať položku", pickItem: "Ťukni a pridaj", worth: "Oplatí sa pridať na trase", add: "+ Pridať", added: "✓ Pridané",
    meals: "5 najlacnejších zdravých obedov", perPortion: "/ porcia", addMeal: "+ Do zoznamu", calc: "Suroviny a ceny", goMeal: "Nakúpiť len na tento obed", pickMeals: "Ktorý obed? (ťukni a vyber)", forPortions: "za 4 porcie", ingr: "suroviny",
    portions: "4 veľké porcie (2 obedy pre 2)", why: "Prečo tento plán", options: "Všetky možnosti",
    option: "Možnosť", basket: "Košík", stockup: "Zásoby", effective: "Efektívne",
    bestSingle: "Najlepší 1 obchod: {s} — {v}.", addWorth: "Pridanie {s} ušetrí {v} (≥ {th}) → choď.", addNot: "Pridanie {s} ušetrí iba {v} (< {th}) → vynechaj.",
    notCompared: "Neporovnané: {s} (žiadne otvorené dáta).", estNote: "{n} položiek s odhadovanou cenou.",
    nothing: "Netreba nič kupovať.", estLike: "tu bez aktuálnej ceny — odhad ako Billa +5 %", noPrice: "bez ceny", est: "odhad", unitPrice: "Cena za jednotku", usual: "bežne", valid: "platí", priceOn: "cena z",
    check: "overiť akciu ↗", less: "−", moreQ: "+", skip: "Dnes nie", wrong: "Zlý produkt", restore: "Znova zobraziť skryté produkty",
    hiddenN: "{n} skrytých produktov", deal: "akcia", healthy: "zdravá akcia", stockTag: "do zásoby",
    stockTitle: "Teraz do zásoby", freshTitle: "Čerstvé akcie tento týždeň", soon: "Čoskoro", from: "od",
    none: "Teraz žiadne veľké akcie.", buy: "kúp", weeks: "4 týždne",
    pricesHint: "Najlacnejšia cena za jednotku v každom obchode. ★ akcia.", search: "Hľadať",
    drugHint: "Drogériu kupuj len keď je lacná.", needNow: "Treba teraz",
    settings: "Nastavenia", stopTh: "Ďalšia zastávka musí ušetriť", tripTh: "Samostatná cesta musí ušetriť", stockPct: "Zásoby od % zľavy", alertPct: "Zdravé extra / upozornenie od % zľavy",
    weekly: "Moja týždenná spotreba", reset: "Obnoviť", data: "Dáta", checkedAt: "Ceny overené {d}", howWorks: "Ako to funguje",
    howText: "Robot každé ráno (+ st/št večer) číta verejné ceny Lidla, Billy, Alberta a Tety. Aplikácia vždy berie najlacnejšiu značku za kg / l / kus a porovná kombinácie obchodov na tvojej trase.",
    covered: "pokryté", notCovered: "nepokryté", loadErr: "Ceny sa ešte nenačítali — skús o chvíľu.", perWeek: "/ týždeň",
    leftover: "zvyšok", allDone: "Hotovo 🎉"
  }
};
const SHOP = { lidl: "Lidl", billa: "Billa", albert: "Albert", kaufland: "Kaufland", tesco: "Tesco", sintra: "Sintra", dm: "dm", teta: "Teta" };
const SHOP_COLOR = { lidl: "#0050aa", billa: "#e2001a", albert: "#0a7c3d", kaufland: "#c8102e", tesco: "#00539f", sintra: "#f39200", teta: "#d6006e", dm: "#002878" };
const DEFAULTS = { stopBrno: 100, tripBrno: 150, stopKk: 4, tripKk: 6, stockPct: 30, alertPct: 40 };
const LS = "saving.v2";
const today = new Date().toISOString().slice(0, 10);

// ============================================================ state
let state = { city: "brno", lang: "en", mode: "big", gym: false, tab: "plan", set: { ...DEFAULTS }, weekly: {}, low: [], drugLow: [], hide: [], day: null };
try { const s = JSON.parse(localStorage.getItem(LS) || "{}"); state = { ...state, ...s, set: { ...DEFAULTS, ...(s.set || {}) } }; } catch (e) {}
function day() {
  if (!state.day || state.day.date !== today) state.day = { date: today, skip: [], add: {}, qty: {}, done: [], drop: [], meals: [] };
  if (!state.day.meals) state.day.meals = [];
  return state.day;
}
function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

let ITEMS = [], BYID = {}, PRICES = null, OPEN = null, ADDING = false;
const $ = (id) => document.getElementById(id);
const L = () => T[state.lang] || T.en;
function t(k, v) { let s = L()[k] ?? T.en[k] ?? k; if (v) for (const [a, b] of Object.entries(v)) s = s.replaceAll("{" + a + "}", b); return s; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function cityData() { return PRICES?.cities?.[state.city]; }
function cur() { return cityData()?.currency || (state.city === "brno" ? "CZK" : "EUR"); }
function money(v, c = cur()) {
  if (v == null || !isFinite(v)) return "—";
  const s = v.toLocaleString(c === "EUR" ? "sk-SK" : "cs-CZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return c === "EUR" ? s + " €" : s + " Kč";
}
function uName(u) { return u === "kg" ? "kg" : u === "l" ? "l" : (state.lang === "sk" ? "ks" : "pc"); }
function iname(it) { return state.lang === "sk" ? it.sk : it.en; }
function qtyTxt(q, u) {
  if (u === "kg") return q < 1 ? Math.round(q * 1000) + " g" : (+q.toFixed(2)) + " kg";
  if (u === "l") return q < 1 ? Math.round(q * 1000) + " ml" : (+q.toFixed(2)) + " l";
  return Math.round(q * 10) / 10 + " " + uName("ks");
}
function dateTxt(iso) { if (!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return d.getDate() + "." + (d.getMonth() + 1) + "."; }
function dtTxt(iso) { const d = new Date(iso); return d.toLocaleDateString(state.lang === "sk" ? "sk-SK" : "en-GB", { weekday: "short" }) + " " + dateTxt(iso) + " " + d.toLocaleTimeString(state.lang === "sk" ? "sk-SK" : "en-GB", { hour: "2-digit", minute: "2-digit" }); }
function thresholds() { return state.city === "brno" ? { stop: +state.set.stopBrno, trip: +state.set.tripBrno } : { stop: +state.set.stopKk, trip: +state.set.tripKk }; }
function weeklyOf(it) { return state.weekly[it.id] ?? it.weekly; }

// ============================================================ prices
const NOW = Date.now();
function validNow(o) {
  const f = o.valid_from ? Date.parse(o.valid_from) : null;
  const to = o.valid_to ? Date.parse(o.valid_to.length === 10 ? o.valid_to + "T23:59:59" : o.valid_to) : null;
  return !(f && f > NOW + 3600e3) && !(to && to < NOW);
}
function upcoming(o) { const f = o.valid_from ? Date.parse(o.valid_from) : null; return f && f > NOW + 3600e3 && f - NOW < 5 * 864e5; }
function hideKey(o) { return o.shop + "|" + o.name; }
function offersFor(id, shop) {
  const d = cityData()?.items?.[id];
  return (d?.offers || []).filter((o) => (!shop || o.shop === shop) && validNow(o) && !state.hide.includes(hideKey(o)));
}
function usual(id) { return cityData()?.items?.[id]?.usual ?? null; }
function discount(o) { const r = usual(o.item) || o.normal_unit; return r && r > o.unit_price ? 1 - o.unit_price / r : 0; }
function validTxt(o) {
  if (o.valid_from || o.valid_to) { const f = o.valid_from ? dateTxt(o.valid_from) : "", to = o.valid_to ? dateTxt(o.valid_to) : ""; return `${t("valid")} ${f}${f && to ? "–" : ""}${to}`; }
  const chk = PRICES?.sources?.[o.shop + "_" + (o.city || state.city)]?.checked || PRICES?.generated;
  return `${t("priceOn")} ${dateTxt(chk)}`;
}

function byWeight(o) { return o.weighted || !o.pack || Math.abs(o.price / o.pack - o.unit_price) / o.unit_price > 0.15; }
function purchase(o, need) {
  if (byWeight(o)) return { o, packs: null, qty: need, cost: o.unit_price * need, paid: o.unit_price };
  let packs = Math.max(1, Math.ceil(need / o.pack - 1e-6)), price = o.price;
  if (o.min_qty > 1 && packs < o.min_qty) {
    const A = o.min_qty * o.price, B = o.normal_price ? packs * o.normal_price : Infinity;
    if (A <= B) packs = o.min_qty; else price = o.normal_price;
  }
  return { o, packs, qty: packs * o.pack, cost: packs * price, paid: price };
}
function packCap(it, need) { return it.shelf === "fresh" ? Math.max(need * 3, weeklyOf(it) * 1.25) : Math.max(need * 4, weeklyOf(it) * 4); }
// always the cheapest alternative: lowest price per unit (cheapest brand) among sensible pack sizes
function bestPurchase(id, shop, need) {
  const it = BYID[id];
  let offs = offersFor(id, shop);
  if (!offs.length) return null;
  const good = offs.filter((o) => o.conf !== "low"); if (good.length) offs = good;
  const cap = packCap(it, need);
  let cands = offs.filter((o) => byWeight(o) || o.pack <= cap || o.pack <= need);
  if (!cands.length) cands = [offs.slice().sort((a, b) => (a.pack || 0) - (b.pack || 0))[0]];
  let best = null, bestEff = Infinity;
  for (const o of cands) {
    const p = purchase(o, need), eff = p.qty ? p.cost / p.qty : o.unit_price;
    if (eff < bestEff - 1e-9 || (Math.abs(eff - bestEff) < 1e-9 && p.cost < best.cost)) { best = p; bestEff = eff; }
  }
  return best;
}

// deals: stock-ups (≥ stock %) for long-life/freezable items, healthy extras (≥ alert %), fresh deals
function deals() {
  const res = [];
  for (const it of ITEMS) {
    if (it.group === "drugstore") continue;
    const kind = it.group === "extras" ? "extra" : it.shelf === "fresh" ? "fresh" : "stock";
    const th = (kind === "extra" ? +state.set.alertPct : +state.set.stockPct) / 100;
    let best = null;
    for (const o of offersFor(it.id).filter((x) => x.conf !== "low" && x.promo)) { const d = discount(o); if (d >= th && (!best || o.unit_price < best.o.unit_price)) best = { o, d }; }
    if (!best) continue;
    const o = best.o;
    let qty = kind === "extra" ? (it.deal_qty || 0.5) : kind === "stock" ? (weeklyOf(it) > 0 ? weeklyOf(it) * 4 : (o.pack || 1) * 2) : (weeklyOf(it) || o.pack || 1);
    let packs = null;
    if (!byWeight(o)) { packs = Math.min(12, Math.max(o.min_qty || 1, Math.ceil(qty / o.pack - 1e-6))); qty = packs * o.pack; } else qty = Math.min(qty, 5);
    const ref = usual(it.id) || o.normal_unit;
    res.push({ it, o, d: best.d, kind, qty, packs, cost: packs ? packs * o.price : qty * o.unit_price, saving: (ref - o.unit_price) * qty, ref });
  }
  return res.sort((a, b) => b.saving - a.saving);
}

function basket() {
  const D = day(), days = state.mode === "quick" ? 1 : 3.5, need = {};
  if (state.mode === "lunch") {
    for (const m of D.meals || []) for (const [id, q] of m.parts) need[id] = (need[id] || 0) + q;
  } else for (const it of ITEMS) {
    if (it.group === "drugstore" || it.group === "extras") continue;
    const w = weeklyOf(it);
    if (it.group === "pantry" || w === 0) { if (state.low.includes(it.id)) need[it.id] = w > 0 ? w * 2 : (it.unit === "ks" ? 1 : 0.5); continue; }
    if (state.mode === "quick" && !it.quick) continue;
    need[it.id] = w * days / 7;
  }
  for (const id of D.skip) delete need[id];
  for (const [id, q] of Object.entries(D.qty)) if (need[id] != null) need[id] = q;
  for (const [id, q] of Object.entries(D.add)) need[id] = (need[id] || 0) + q;
  return Object.entries(need).filter(([id, q]) => BYID[id] && q > 0).map(([id, q]) => ({ it: BYID[id], need: q, added: !!D.add[id] }));
}

function evaluate(shops, bask, ds) {
  const lines = []; let total = 0, est = 0, normal = 0;
  for (const b of bask) {
    let best = null;
    for (const s of shops) { const p = bestPurchase(b.it.id, s, b.need); if (p && (!best || p.cost < best.cost)) best = { ...p, shop: s }; }
    if (!best) {
      // conservative estimate: what the item costs at Billa (full price list) + 5 % uncertainty
      const ref = cityData().covered.includes("billa") ? bestPurchase(b.it.id, "billa", b.need) : null;
      if (ref) best = { shop: shops[0], est: true, cost: ref.cost * 1.05, qty: ref.qty, packs: ref.packs, paid: ref.paid * 1.05, refO: ref.o };
      else {
        const u = (usual(b.it.id) ?? Math.min(...offersFor(b.it.id).map((o) => o.unit_price), Infinity)) * 1.1;
        if (!isFinite(u)) { lines.push({ b, missing: true }); continue; }
        best = { shop: shops[0], est: true, cost: u * b.need, qty: b.need, packs: null, paid: u };
      }
      est++;
    }
    lines.push({ b, ...best }); total += best.cost;
    const u = usual(b.it.id); normal += (u && best.o ? Math.max(u, best.o.unit_price) * best.qty : best.cost);
  }
  let bonus = 0;
  if (state.mode === "big") for (const d of ds) if (d.kind === "stock" && shops.includes(d.o.shop) && !bask.find((b) => b.it.id === d.it.id)) bonus += d.saving;
  return { shops, lines, total, est, normal, bonus, score: total - bonus };
}

function combos() {
  const cd = cityData(); if (!cd) return [];
  const cov = cd.covered;
  if (state.city === "brno") {
    const home = [["lidl"], ["billa"], ["lidl", "billa"]];
    const gym = [["albert"], ["albert", "lidl"], ["albert", "billa"], ["albert", "lidl", "billa"]];
    return (state.gym ? home.concat(gym) : home).filter((c) => c.every((s) => cov.includes(s)));
  }
  const out = cov.map((s) => [s]); if (cov.length > 1) out.push(cov.slice());
  return out;
}

function pickRoute(opts) {
  const th = thresholds();
  const singles = opts.filter((o) => o.shops.length === 1).sort((a, b) => a.score - b.score);
  let rec = singles[0];
  const steps = [];
  for (;;) {
    const next = opts.filter((o) => o.shops.length === rec.shops.length + 1 && rec.shops.every((s) => o.shops.includes(s))).sort((a, b) => a.score - b.score)[0];
    if (!next) break;
    const added = next.shops.find((s) => !rec.shops.includes(s)), gain = rec.score - next.score;
    steps.push({ ok: gain >= th.stop, added, gain });
    if (gain >= th.stop) rec = next; else break;
  }
  return { rec, steps, bestSingle: singles[0] };
}

function decide() {
  const ds = deals();
  const D = day();
  if (state.mode === "lunch" && !D.meals.length) { const m = mealIdeas(1)[0]; if (m) D.meals = [{ key: m.key, parts: m.parts.map((p) => [p.id, p.qty]) }]; }
  // healthy extras at a very good price go straight into the list (unless removed) — not on a lunch-only trip
  const bask = basket();
  if (state.mode !== "lunch") for (const d of ds) if (d.kind === "extra" && !D.drop.includes(d.it.id) && !bask.find((b) => b.it.id === d.it.id)) bask.push({ it: d.it, need: d.qty, auto: true });
  const opts = combos().map((c) => evaluate(c, bask, ds));
  if (!opts.length) return { bask, ds, opts, rec: null, steps: [] };
  const pr = pickRoute(opts);
  let rec = pr.rec;
  const steps = pr.steps, singles = [pr.bestSingle];
  // auto extras only stay if they are really on a deal in the chosen shops
  rec.lines = rec.lines.filter((l) => !(l.b.auto && (l.est || !l.o || discount(l.o) < state.set.alertPct / 100)));
  rec.total = rec.lines.reduce((a, l) => a + (l.cost || 0), 0);
  return { bask, ds, opts, rec, steps, bestSingle: singles[0] };
}

const MEAL_PROTEINS = [["chicken", "chicken", 0.75], ["chicken_frozen", "chicken", 0.75], ["turkey", "turkey", 0.75], ["pork", "pork", 0.75],
  ["liver_chicken", "liver", 0.75], ["liver_pork", "liver", 0.75], ["beef", "beef", 0.75], ["salmon", "fish", 0.6], ["tuna", "tuna", 0.32]];
const MEAL_CARBS = [[["rice", 0.4]], [["pasta", 0.4], ["tomato_can", 0.8]], [["sweet_potato", 0.8]]];
const MEAL_VEGS = [["broccoli", 0.4], ["frozen_veg", 0.4], ["carrot", 0.4], ["paprika", 0.4], ["spinach", 0.3], ["mushrooms", 0.4], ["sauerkraut", 0.5]];
const SHORT = {
  en: { chicken: "Chicken", chicken_frozen: "Chicken", turkey: "Turkey", pork: "Pork", liver_chicken: "Chicken liver", liver_pork: "Pork liver", beef: "Beef", salmon: "Salmon", tuna: "Tuna",
        rice: "rice", pasta: "pasta", tomato_can: "tomato sauce", sweet_potato: "sweet potatoes", broccoli: "broccoli", frozen_veg: "frozen veg", carrot: "carrots", paprika: "peppers", spinach: "spinach", mushrooms: "mushrooms", sauerkraut: "sauerkraut" },
  sk: { chicken: "Kuracie", chicken_frozen: "Kuracie", turkey: "Morčacie", pork: "Bravčové", liver_chicken: "Kuracia pečeň", liver_pork: "Bravčová pečeň", beef: "Hovädzie", salmon: "Losos", tuna: "Tuniak",
        rice: "ryža", pasta: "cestoviny", tomato_can: "paradajková omáčka", sweet_potato: "batáty", broccoli: "brokolica", frozen_veg: "mrazená zelenina", carrot: "mrkva", paprika: "paprika", spinach: "špenát", mushrooms: "šampiňóny", sauerkraut: "kyslá kapusta" },
};
function shortName(id) { return (SHORT[state.lang] || SHORT.en)[id] || iname(BYID[id]); }
function mealIdeas(n = 5) {
  const cheap = (id) => { const o = offersFor(id).filter((x) => x.conf !== "low").sort((a, b) => a.unit_price - b.unit_price)[0]; return o ? o.unit_price : null; };
  const vegs = MEAL_VEGS.filter(([id]) => BYID[id] && cheap(id) != null).sort((a, b) => cheap(a[0]) * a[1] - cheap(b[0]) * b[1]).slice(0, 5);
  const sweetDeal = offersFor("sweet_potato").some((o) => o.promo && discount(o) >= state.set.stockPct / 100);
  const carbs = MEAL_CARBS.filter((c) => c.every(([id]) => BYID[id] && (cheap(id) != null || usual(id) != null)) && (c[0][0] !== "sweet_potato" || sweetDeal));
  const cands = [];
  for (const [pid, fam, pq] of MEAL_PROTEINS) {
    if (!BYID[pid] || cheap(pid) == null) continue;
    for (const c of carbs) for (const v of vegs) {
      if (v[0] === "sauerkraut" && (pid !== "pork" || c[0][0] === "pasta")) continue;
      const parts = [[pid, pq], ...c, v];
      const bask = parts.map(([id, q]) => ({ it: BYID[id], need: q }));
      const opts = combos().map((cs) => evaluate(cs, bask, []));
      if (!opts.length) continue;
      const { rec } = pickRoute(opts);
      if (rec.lines.some((l) => l.missing)) continue;
      cands.push({ key: parts.map((x) => x[0]).join("+"), fam, parts: parts.map(([id, q]) => ({ id, qty: q })), rec, total: rec.total, per: rec.total / 4 });
    }
  }
  cands.sort((a, b) => a.per - b.per);
  const out = [], fams = new Set(), keys = new Set(), used = {};
  const side = (c) => c.parts.slice(1, -1).map((p) => p.id).join("+"), veg = (c) => c.parts[c.parts.length - 1].id;
  const ok = (c, cap) => (used["s:" + side(c)] || 0) < cap && (used["v:" + veg(c)] || 0) < cap;
  const take = (c) => { fams.add(c.fam); keys.add(c.key); out.push(c); used["s:" + side(c)] = (used["s:" + side(c)] || 0) + 1; used["v:" + veg(c)] = (used["v:" + veg(c)] || 0) + 1; };
  for (const cap of [2, 3, 99]) {
    for (const c of cands) { if (out.length >= n) break; if (!fams.has(c.fam) && !keys.has(c.key) && ok(c, cap)) take(c); }
  }
  for (const c of cands) { if (out.length >= n) break; if (!keys.has(c.key)) take(c); }
  return out.sort((a, b) => a.per - b.per);
}
function mealName(m) { const ids = m.parts.map((p) => p.id); return ids.map((id, i) => (i === 0 ? shortName(id) : shortName(id))).join(" + "); }
function mealWhere(m) {
  const shops = m.rec.shops.filter((s) => m.rec.lines.some((l) => l.shop === s));
  if (shops.length === 1) return `<span class="dot" style="background:${SHOP_COLOR[shops[0]]};display:inline-block"></span> <b>${SHOP[shops[0]]}</b> — ${state.lang === "sk" ? "všetko" : "everything"}`;
  return shops.map((s) => `<span class="dot" style="background:${SHOP_COLOR[s]};display:inline-block"></span> <b>${SHOP[s]}</b> (${m.rec.lines.filter((l) => l.shop === s).map((l) => shortName(l.b.it.id).toLowerCase()).join(", ")})`).join(" → ");
}

// ============================================================ rendering helpers
function discBadge(o) {
  const d = discount(o);
  if (o.promo && d >= 0.05) return `<span class="badge ${d >= state.set.alertPct / 100 ? "b-bad" : d >= state.set.stockPct / 100 ? "b-warn" : "b-good"}">−${Math.round(d * 100)}%</span>`;
  return "";
}
function amountTxt(l) {
  const u = l.b.it.unit, o = l.o || l.refO;
  if (l.packs && o) return o.pack ? `${l.packs}× ${qtyTxt(o.pack, u)}` : `${l.packs}×`;
  return "≈ " + qtyTxt(l.qty, u);
}
function lineHtml(l) {
  const D = day(), id = l.b.it.id, done = D.done.includes(id), open = OPEN === id;
  const tag = l.b.auto ? `<span class="badge b-good">${t("healthy")}</span>` : "";
  let more = "";
  if (open) {
    const o = l.o;
    const unitRow = o ? `${t("unitPrice")}: <b>${money(o.unit_price)}/${uName(l.b.it.unit)}</b>${usual(id) ? ` · ${t("usual")} ${money(usual(id))}` : ""}` : `${t("est")}: ${money(l.paid)}/${uName(l.b.it.unit)}`;
    const calc = l.packs ? `${l.packs} × ${money(l.paid)} = ${money(l.cost)}` : `${(+l.qty.toFixed(3))} ${uName(l.b.it.unit)} × ${money(l.paid)} = ${money(l.cost)}`;
    more = `<div class="more"><div>${unitRow}</div><div>${calc}</div>${o ? `<div class="muted">${esc(o.name)} · ${validTxt(o)}${o.card ? " · " + esc(o.card) : ""}${o.url ? ` · <a href="${esc(o.url)}" target="_blank" rel="noopener">${t("check")}</a>` : ""}</div>` : ""}
      <div class="acts"><button class="btn" data-q="-" data-id="${id}">−</button><button class="btn" data-q="+" data-id="${id}">+</button>
      <button class="btn" data-skip="${id}">${t("skip")}</button>${o ? `<button class="btn ghost" data-hide="${esc(hideKey(o))}">${t("wrong")}</button>` : ""}</div></div>`;
  }
  return `<div class="li ${done ? "done" : ""}">
    <button class="ck" data-done="${id}" aria-label="done">${done ? "✓" : ""}</button>
    <div data-open="${id}"><div class="nm">${esc(iname(l.b.it))}<span class="qty">${amountTxt(l)}</span> ${l.o ? discBadge(l.o) : `<span class="badge b-warn">${t("est")}</span>`} ${tag}</div>
      <div class="sub">${l.o ? esc(l.o.name) : t("estLike")}</div></div>
    <div class="pr">${money(l.cost)}</div>${more}</div>`;
}
function addRowHtml(d, onRoute) {
  const D = day(), added = !!D.add[d.it.id];
  const u = d.it.unit, amount = d.packs ? `${d.packs}× ${qtyTxt(d.o.pack, u)}` : qtyTxt(d.qty, u);
  return `<div class="addrow"><div><div class="t">${esc(iname(d.it))} <span class="qty">${amount}</span> ${discBadge(d.o)}</div>
    <div class="m">${SHOP[d.o.shop]} · ${money(d.cost)} · ${t("save")} <b>${money(d.saving)}</b>${onRoute ? "" : " · " + SHOP[d.o.shop]}</div></div>
    <button class="btn ${added ? "" : "primary"}" data-adddeal="${d.it.id}" data-qty="${d.qty}">${added ? t("added") : t("add")}</button></div>`;
}
function mealsHtml(list, picker) {
  if (!list.length) return "";
  const D = day(), sel = new Set((D.meals || []).map((m) => m.key));
  return `<div class="card idea"><h2>${picker ? t("pickMeals") : t("meals")}</h2>${list.map((m, k) => {
    const lines = m.rec.lines.map((l) => `<div class="row"><span>${amountTxt(l)} ${esc(shortName(l.b.it.id).toLowerCase())} · <b>${SHOP[l.shop]}</b>${l.o ? ` <span class="muted">${esc(l.o.name.slice(0, 32))}</span>` : ` <span class="muted">${t("est")}</span>`}</span><span>${money(l.cost)}</span></div>`).join("");
    const chosen = sel.has(m.key);
    return `<div class="meal" ${picker ? `data-mealpick="${k}" style="cursor:pointer"` : ""}><div class="row"><div class="t">${picker ? (chosen ? "✅ " : "⬜ ") : k + 1 + ". "}${esc(mealName(m))}</div><span class="per">${money(m.per)} <span class="tiny" style="font-weight:600">${t("perPortion")}</span></span></div>
      <div class="small" style="margin-top:4px">📍 ${mealWhere(m)} · ${money(m.total)} ${t("forPortions")}</div>
      <details style="margin-top:4px"><summary class="small">${t("calc")}</summary><div class="calc">${lines}</div></details>
      ${picker ? "" : `<div class="row" style="margin-top:8px;justify-content:flex-start;gap:6px"><button class="btn primary" data-mealgo="${k}">${t("goMeal")}</button><button class="btn" data-meal="${k}">${t("addMeal")}</button></div>`}</div>`;
  }).join("")}</div>`;
}

// ============================================================ pages
let LAST = null, LAST_MEALS = [];
function renderPlan() {
  const out = $("planOut");
  $("gymRow").style.display = state.city === "brno" ? "" : "none";
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const r = decide(); LAST = r;
  if (!r.rec) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const rec = r.rec, D = day(), th = thresholds();
  const cards = new Set(); rec.lines.forEach((l) => l.o?.card && cards.add(l.o.card));
  const saved = Math.max(0, rec.normal - rec.total);
  const lunch = state.mode === "lunch", nMeals = Math.max(1, (D.meals || []).length);
  const usedShops = rec.shops.filter((s) => rec.lines.some((l) => l.shop === s && !l.missing));
  let html = `<div class="card hero"><div class="label">${t("goTo")}</div>
    <div class="go">${(usedShops.length ? usedShops : rec.shops).map((s) => SHOP[s]).join(" → ")}</div>
    <div class="big"><div><b>${money(rec.total)}</b> <span>${t("pay")}</span></div>${lunch ? `<div><b>${money(rec.total / (4 * nMeals))}</b> <span>${t("perPortion")}</span></div>` : `<div><b>${money(saved)}</b> <span>${t("save")}</span></div>`}</div>
    <div class="pills">${cards.size ? [...cards].map((c) => `<span class="pill">💳 ${esc(c)}</span>`).join("") : `<span class="pill">${t("noCard")}</span>`}</div></div>`;
  if (lunch) { LAST_MEALS = mealIdeas(5); html += mealsHtml(LAST_MEALS, true); }
  // shopping list
  html += `<div class="card"><h2>${t("list")}</h2>`;
  const all = rec.lines.filter((l) => !l.missing);
  for (const s of rec.shops) {
    const ls = all.filter((l) => l.shop === s);
    if (!ls.length) continue;
    const sub = ls.reduce((a, l) => a + l.cost, 0);
    html += `<div class="shop"><span class="dot" style="background:${SHOP_COLOR[s]}"></span>${SHOP[s]}<span class="sum">${money(sub)}</span></div>`;
    html += ls.map(lineHtml).join("");
  }
  if (all.length && all.every((l) => D.done.includes(l.b.it.id))) html += `<div class="note" style="text-align:center;font-size:1rem">${t("allDone")}</div>`;
  const missing = rec.lines.filter((l) => l.missing);
  if (missing.length) html += `<div class="note">${t("noPrice")}: ${missing.map((l) => esc(iname(l.b.it))).join(", ")}</div>`;
  // add item
  const inList = new Set(rec.lines.map((l) => l.b.it.id));
  html += `<div style="margin-top:10px"><button class="btn" id="addItemBtn">${t("addItem")}</button></div>`;
  if (ADDING) html += `<div class="note">${t("pickItem")}</div><div class="chips">${ITEMS.filter((it) => it.group !== "drugstore" && !inList.has(it.id)).map((it) => `<button class="chip" data-additem="${it.id}">${esc(iname(it))}</button>`).join("")}</div>`;
  html += `</div>`;
  // worth adding on route (stock-ups + removed extras)
  if (!lunch) {
    const worth = r.ds.filter((d) => (d.kind === "stock" || (d.kind === "extra" && D.drop.includes(d.it.id))) && rec.shops.includes(d.o.shop)).slice(0, 5);
    if (worth.length) html += `<div class="card"><h2>${t("worth")}</h2>${worth.map((d) => addRowHtml(d, true)).join("")}</div>`;
    LAST_MEALS = mealIdeas(5);
    html += mealsHtml(LAST_MEALS);
  }
  // why + options (folded)
  const cd = cityData(), why = [];
  why.push(t("bestSingle", { s: SHOP[r.bestSingle.shops[0]], v: money(r.bestSingle.total) }));
  r.steps.forEach((s) => why.push(t(s.ok ? "addWorth" : "addNot", { s: SHOP[s.added], v: money(s.gain), th: money(th.stop) })));
  if (cd.uncovered?.length) why.push(t("notCompared", { s: cd.uncovered.map((s) => SHOP[s]).join(", ") }));
  if (rec.est) why.push(t("estNote", { n: rec.est }));
  html += `<details class="card"><summary>${t("why")}</summary><ul class="why">${why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>`;
  const sorted = r.opts.slice().sort((a, b) => a.score - b.score);
  html += `<details class="card"><summary>${t("options")}</summary><div class="tw"><table><thead><tr><th>${t("option")}</th><th class="num">${t("basket")}</th><th class="num">${t("stockup")}</th><th class="num">${t("effective")}</th></tr></thead><tbody>
    ${sorted.map((o) => `<tr class="${o === rec ? "best" : ""}"><td>${o.shops.map((s) => SHOP[s]).join(" + ")}${o.est ? ` <span class="badge b-warn">${o.est} ${t("est")}</span>` : ""}</td><td class="num">${money(o.total)}</td><td class="num">${o.bonus > 0.5 ? "−" + money(o.bonus) : "—"}</td><td class="num">${money(o.score)}</td></tr>`).join("")}
    </tbody></table></div></details>`;
  out.innerHTML = html;
}

function renderDeals() {
  const out = $("dealsOut");
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const ds = deals();
  const stock = ds.filter((d) => d.kind === "stock" || d.kind === "extra");
  const fresh = ds.filter((d) => d.kind === "fresh");
  let html = `<div class="card"><h2>${t("stockTitle")}</h2>${stock.length ? stock.map((d) => addRowHtml(d, false)).join("") : `<div class="empty">${t("none")}</div>`}</div>`;
  if (fresh.length) html += `<div class="card"><h2>${t("freshTitle")}</h2>${fresh.map((d) => `<div class="deal"><div class="row"><div class="t">${esc(iname(d.it))} · ${SHOP[d.o.shop]}</div>${discBadge(d.o)}</div><div class="m">${esc(d.o.name)} · ${money(d.o.price)} · ${money(d.o.unit_price)}/${uName(d.it.unit)} · ${validTxt(d.o)}</div></div>`).join("")}</div>`;
  LAST_MEALS = mealIdeas(5);
  html += mealsHtml(LAST_MEALS);
  const up = [];
  for (const it of ITEMS) for (const o of (cityData().items[it.id]?.offers || [])) if (upcoming(o) && discount(o) >= 0.2) up.push({ it, o });
  if (up.length) html += `<div class="card"><h2>${t("soon")}</h2>${up.slice(0, 12).map(({ it, o }) => `<div class="deal"><div class="row"><div class="t">${esc(iname(it))} · ${SHOP[o.shop]}</div>${discBadge(o)}</div><div class="m">${esc(o.name)} · ${money(o.price)} · ${t("from")} ${dateTxt(o.valid_from)}</div></div>`).join("")}</div>`;
  out.innerHTML = html;
}

function renderPrices() {
  const out = $("pricesOut");
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const q = ($("q").value || "").toLowerCase(), shops = cityData().covered.concat(state.city === "brno" ? ["teta"] : []);
  let html = `<div class="card note" style="margin-top:0">${t("pricesHint")} ${t("checkedAt", { d: dtTxt(PRICES.generated) })}</div>`;
  for (const g of ["dinner", "lunch", "breakfast", "fruit", "pantry", "extras", "drugstore"]) {
    const its = ITEMS.filter((it) => it.group === g && (!q || iname(it).toLowerCase().includes(q) || it.en.toLowerCase().includes(q)));
    if (!its.length) continue;
    const sh = g === "drugstore" ? shops : shops.filter((s) => s !== "teta");
    html += `<div class="card"><div class="tw"><table><thead><tr><th></th>${sh.map((s) => `<th class="num">${SHOP[s]}</th>`).join("")}<th class="num">${t("usual")}</th></tr></thead><tbody>`;
    for (const it of its) {
      const cells = sh.map((s) => offersFor(it.id, s).sort((a, b) => a.unit_price - b.unit_price)[0] || null);
      const min = Math.min(...cells.filter(Boolean).map((o) => o.unit_price));
      html += `<tr><td><b>${esc(iname(it))}</b><div class="tiny muted">/${uName(it.unit)}</div></td>${cells.map((o) => o ? `<td class="num" style="${o.unit_price === min ? "font-weight:700;color:var(--good)" : ""}">${money(o.unit_price)}${o.promo ? "★" : ""}<div class="tiny muted">${esc(o.name.slice(0, 20))}</div></td>` : `<td class="num muted">—</td>`).join("")}<td class="num muted">${money(usual(it.id))}</td></tr>`;
    }
    html += `</tbody></table></div></div>`;
  }
  out.innerHTML = html;
}

function renderDrug() {
  const out = $("drugOut");
  if (!PRICES) { out.innerHTML = `<div class="card empty">${t("loadErr")}</div>`; return; }
  const its = ITEMS.filter((it) => it.group === "drugstore");
  const dun = cityData().drug_uncovered || [];
  let html = `<div class="card"><div class="small muted">${t("drugHint")}${dun.length ? " " + t("notCompared", { s: dun.map((x) => SHOP[x]).join(", ") }) : ""}</div><div class="small" style="margin-top:8px"><b>${t("needNow")}:</b></div>
    <div class="chips">${its.map((it) => `<button class="chip ${state.drugLow.includes(it.id) ? "on" : ""}" data-dlow="${it.id}">${esc(iname(it))}</button>`).join("")}</div></div>`;
  for (const it of its) {
    const offs = offersFor(it.id).sort((a, b) => a.unit_price - b.unit_price);
    const need = state.drugLow.includes(it.id);
    html += `<div class="card"><div class="row"><h2 style="margin:0">${esc(iname(it))}</h2>${need ? `<span class="badge b-accent">${t("needNow")}</span>` : ""}</div>`;
    if (!offs.length) { html += `<div class="empty">—</div></div>`; continue; }
    html += offs.slice(0, 3).map((o, i) => `<div class="deal"><div class="row"><div class="t">${i === 0 ? "★ " : ""}${SHOP[o.shop]} · ${money(o.unit_price)}/${uName(it.unit)}</div>${discBadge(o)}</div><div class="m">${esc(o.name)} · ${money(o.price)} · ${validTxt(o)}</div></div>`).join("");
    html += `</div>`;
  }
  out.innerHTML = html;
}

function renderSettings() {
  const s = state.set, src = PRICES?.sources || {};
  const rows = Object.entries(src).filter(([k]) => k.endsWith("_" + state.city)).map(([k, v]) => {
    const shop = k.split("_")[0], ok = v.status === "ok";
    return `<div class="setrow"><div><b>${SHOP[shop] || shop}</b><div class="tiny muted">${esc(v.note || "")}${v.checked ? " · " + dtTxt(v.checked) : ""}</div></div><span class="badge ${ok ? "b-good" : "b-warn"}">${ok ? t("covered") + " · " + v.offers : t("notCovered")}</span></div>`;
  }).join("");
  const wk = ITEMS.filter((it) => it.group !== "drugstore" && it.group !== "extras").map((it) => `<div class="setrow"><span>${esc(iname(it))} <span class="tiny muted">${uName(it.unit)} ${t("perWeek")}</span></span><input type="number" step="0.05" min="0" data-wk="${it.id}" value="${weeklyOf(it)}"></div>`).join("");
  $("setOut").innerHTML = `<div class="card"><h2>${t("settings")}</h2>
    <div class="setrow"><span>${t("stopTh")} (Brno, Kč)</span><input type="number" data-set="stopBrno" value="${s.stopBrno}"></div>
    <div class="setrow"><span>${t("tripTh")} (Brno, Kč)</span><input type="number" data-set="tripBrno" value="${s.tripBrno}"></div>
    <div class="setrow"><span>${t("stopTh")} (Kežmarok, €)</span><input type="number" data-set="stopKk" value="${s.stopKk}"></div>
    <div class="setrow"><span>${t("tripTh")} (Kežmarok, €)</span><input type="number" data-set="tripKk" value="${s.tripKk}"></div>
    <div class="setrow"><span>${t("stockPct")}</span><input type="number" data-set="stockPct" value="${s.stockPct}"></div>
    <div class="setrow"><span>${t("alertPct")}</span><input type="number" data-set="alertPct" value="${s.alertPct}"></div>
    <div style="margin-top:8px"><button class="btn" id="resetSet">${t("reset")}</button></div></div>
    <details class="card"><summary>${t("weekly")}</summary>${wk}<div style="margin-top:8px"><button class="btn" id="resetWk">${t("reset")}</button></div></details>
    <div class="card"><h2>${t("data")}</h2><div class="small muted">${PRICES ? t("checkedAt", { d: dtTxt(PRICES.generated) }) : "—"}</div>${rows}
      ${state.hide.length ? `<div style="margin-top:10px" class="row"><span class="small">${t("hiddenN", { n: state.hide.length })}</span><button class="btn" id="unhide">${t("restore")}</button></div>` : ""}</div>
    <div class="card"><h2>${t("howWorks")}</h2><div class="small">${t("howText")}</div></div>`;
  $("setOut").querySelectorAll("input[data-set]").forEach((el) => el.addEventListener("change", () => { state.set[el.dataset.set] = +el.value; save(); renderAll(); }));
  $("setOut").querySelectorAll("input[data-wk]").forEach((el) => el.addEventListener("change", () => { state.weekly[el.dataset.wk] = Math.max(0, +el.value); save(); renderPlan(); renderDeals(); }));
  $("resetSet").onclick = () => { state.set = { ...DEFAULTS }; save(); renderAll(); };
  $("resetWk").onclick = () => { state.weekly = {}; save(); renderAll(); };
  if ($("unhide")) $("unhide").onclick = () => { state.hide = []; save(); renderAll(); };
}

function renderChrome() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  for (const id of ["lang", "city", "mode"]) $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === state[id]));
  $("gym").checked = !!state.gym;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.p === state.tab));
  document.querySelectorAll(".page").forEach((p) => p.classList.toggle("on", p.id === "p-" + state.tab));
  $("q").placeholder = t("search");
  if (PRICES) $("updated").textContent = t("checkedAt", { d: dtTxt(PRICES.generated) });
}
function renderAll() { renderChrome(); renderPlan(); renderDeals(); renderPrices(); renderDrug(); renderSettings(); }

// ============================================================ events
function step(id) {
  const it = BYID[id], o = LAST?.rec?.lines.find((l) => l.b.it.id === id)?.o;
  return o && o.pack && !o.weighted ? o.pack : it.unit === "ks" ? 1 : 0.25;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-open], [data-mealpick]"); if (!b) return;
  const D = day();
  const seg = b.closest(".seg");
  if (seg && b.dataset.v) { state[seg.id] = b.dataset.v; OPEN = null; save(); renderAll(); return; }
  if (b.dataset.p) { state.tab = b.dataset.p; save(); renderChrome(); window.scrollTo(0, 0); return; }
  if (b.dataset.done) { const id = b.dataset.done; D.done = D.done.includes(id) ? D.done.filter((x) => x !== id) : D.done.concat(id); save(); renderPlan(); return; }
  if (b.dataset.open) { OPEN = OPEN === b.dataset.open ? null : b.dataset.open; renderPlan(); return; }
  if (b.dataset.q) {
    const id = b.dataset.id, cur0 = LAST.rec.lines.find((l) => l.b.it.id === id)?.b.need || 0, st = step(id);
    const nv = Math.max(0, cur0 + (b.dataset.q === "+" ? st : -st));
    if (D.add[id] != null) D.add[id] = Math.max(0, D.add[id] + (b.dataset.q === "+" ? st : -st)); else D.qty[id] = nv;
    if (nv <= 0) D.skip.push(id);
    save(); renderPlan(); return;
  }
  if (b.dataset.skip) {
    const id = b.dataset.skip;
    if (LAST?.bask.find((x) => x.it.id === id && x.auto)) D.drop.push(id); else { D.skip.push(id); delete D.add[id]; }
    OPEN = null; save(); renderPlan(); return;
  }
  if (b.dataset.hide) { state.hide.push(b.dataset.hide); OPEN = null; save(); renderAll(); return; }
  if (b.id === "addItemBtn") { ADDING = !ADDING; renderPlan(); return; }
  if (b.dataset.additem) {
    const it = BYID[b.dataset.additem];
    D.skip = D.skip.filter((x) => x !== it.id); D.drop = D.drop.filter((x) => x !== it.id);
    D.add[it.id] = (D.add[it.id] || 0) + (it.deal_qty || (weeklyOf(it) > 0 ? weeklyOf(it) / 2 : (it.unit === "ks" ? 1 : 0.5)));
    ADDING = false; save(); renderPlan(); return;
  }
  if (b.dataset.adddeal) {
    const id = b.dataset.adddeal;
    if (D.add[id]) delete D.add[id]; else { D.add[id] = +b.dataset.qty; D.skip = D.skip.filter((x) => x !== id); D.drop = D.drop.filter((x) => x !== id); }
    save(); renderPlan(); renderDeals(); return;
  }
  if (b.dataset.meal != null) {
    const m = LAST_MEALS[+b.dataset.meal]; if (!m) return;
    for (const p of m.parts) { D.add[p.id] = (D.add[p.id] || 0) + p.qty; D.skip = D.skip.filter((x) => x !== p.id); }
    state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.mealgo != null) {
    const m = LAST_MEALS[+b.dataset.mealgo]; if (!m) return;
    state.mode = "lunch"; D.meals = [{ key: m.key, parts: m.parts.map((p) => [p.id, p.qty]) }];
    state.tab = "plan"; save(); renderAll(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.mealpick != null) {
    if (e.target.closest("summary, details")) return;
    const m = LAST_MEALS[+b.dataset.mealpick]; if (!m) return;
    const has = D.meals.find((x) => x.key === m.key);
    D.meals = has ? D.meals.filter((x) => x.key !== m.key) : D.meals.concat({ key: m.key, parts: m.parts.map((p) => [p.id, p.qty]) });
    save(); renderPlan(); return;
  }
  if (b.dataset.dlow) { const id = b.dataset.dlow; state.drugLow = state.drugLow.includes(id) ? state.drugLow.filter((x) => x !== id) : state.drugLow.concat(id); save(); renderDrug(); return; }
});
$("gym").addEventListener("change", (e) => { state.gym = e.target.checked; save(); renderPlan(); });
$("q").addEventListener("input", renderPrices);

// ============================================================ load
async function load() {
  renderChrome();
  try {
    const [ci, pr] = await Promise.all([fetch("config/items.json", { cache: "no-cache" }), fetch("data/prices.json", { cache: "no-cache" })]);
    if (!ci.ok || !pr.ok) throw new Error("http");
    ITEMS = (await ci.json()).items; BYID = Object.fromEntries(ITEMS.map((i) => [i.id, i]));
    PRICES = await pr.json();
  } catch (e) { PRICES = null; }
  day(); save();
  renderAll();
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {}));
load();
</script>
</body>
</html>

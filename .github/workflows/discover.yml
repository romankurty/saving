name: discover-sources

on:
  workflow_dispatch:
  push:
    paths:
      - "robot/discover.py"
      - ".github/workflows/discover.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python robot/discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery
          path: out/
          retention-days: 1

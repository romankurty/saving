name: car-robot

on:
  schedule:
    - cron: "40 4 * * *"      # every morning (~05:40 SK time in winter)
    - cron: "40 15 * * *"     # afternoon refresh (~16:40)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python robot/carbot.py
      - name: Save new offers
        run: |
          git config user.name "saving-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out && cp auta/data/*.json /tmp/out/
          for attempt in 1 2 3; do
            git checkout -- auta/data 2>/dev/null || true
            git pull --rebase origin main
            mkdir -p auta/data && cp /tmp/out/*.json auta/data/
            git add auta/data
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Car offers update $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep 10
          done
          exit 1

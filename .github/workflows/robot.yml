name: price-robot

on:
  schedule:
    - cron: "15 4 * * *"      # every morning (~05:15 Brno time in winter)
    - cron: "15 17 * * 3,4"   # Wednesday + Thursday evening, when new leaflets start
  workflow_dispatch:
  push:
    paths:
      - "robot/fetch_prices.py"
      - "robot/items_def.py"
      - "robot/kaufland_ocr.py"
      - ".github/workflows/robot.yml"

permissions:
  contents: write

concurrency:
  group: price-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR (Kaufland leaflet reader)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ces > /dev/null || echo "OCR install failed - Kaufland scan will be skipped"
      - run: pip install requests pytesseract pillow
      - run: python robot/fetch_prices.py
      - name: Save new prices
        run: |
          git config user.name "saving-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out && cp data/prices.json data/history.json /tmp/out/ && cp config/items.json /tmp/out/items.json
          for attempt in 1 2 3; do
            git checkout -- data config 2>/dev/null || true
            git pull --rebase origin main
            mkdir -p data config
            cp /tmp/out/prices.json /tmp/out/history.json data/ && cp /tmp/out/items.json config/items.json
            git add data config
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Prices update $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard HEAD~1
            sleep 10
          done
          exit 1
